  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

  <style>
    :root { --neon: #39ff88; --hack: #b026ff; --void: #05060a; }
    html, body { background: var(--void); color: #e6e8f0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-image:
        radial-gradient(circle at 15% -10%, rgba(176, 38, 255, .18), transparent 45%),
        radial-gradient(circle at 100% 20%, rgba(57, 255, 136, .10), transparent 40%),
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: auto, auto, 32px 32px, 32px 32px;
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::selection { background: var(--hack); color: #fff; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #2a2f45; border-radius: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .glow-text-green { text-shadow: 0 0 8px rgba(57,255,136,.8), 0 0 22px rgba(57,255,136,.35); }
    .glow-text-purple { text-shadow: 0 0 8px rgba(176,38,255,.9), 0 0 24px rgba(176,38,255,.4); }
    .glow-green { box-shadow: 0 0 0 1px rgba(57,255,136,.45), 0 0 18px rgba(57,255,136,.18); }
    .glow-purple { box-shadow: 0 0 0 1px rgba(176,38,255,.55), 0 0 26px rgba(176,38,255,.25); }

    .card {
      background: linear-gradient(180deg, rgba(17,20,32,.92), rgba(9,11,18,.92));
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      backdrop-filter: blur(6px);
    }
    .card-purple {
      background: linear-gradient(180deg, rgba(40, 10, 66, .55), rgba(12, 6, 22, .9));
      border: 1px solid rgba(176,38,255,.45);
      box-shadow: 0 0 30px rgba(176,38,255,.18), inset 0 0 40px rgba(176,38,255,.06);
      border-radius: 18px;
    }

    .glitch { position: relative; }
    .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .glitch::before { color: var(--hack); clip-path: inset(0 0 55% 0); animation: glitchA 3.2s infinite steps(1); opacity: .8; }
    .glitch::after { color: var(--neon); clip-path: inset(55% 0 0 0); animation: glitchB 2.7s infinite steps(1); opacity: .8; }
    @keyframes glitchA { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(3px,-1px); } 96% { transform: translate(-2px,1px); } }
    @keyframes glitchB { 0%, 88%, 100% { transform: translate(0,0); } 89% { transform: translate(-3px,1px); } 94% { transform: translate(2px,0); } }

    .pitch {
      position: relative;
      background: repeating-linear-gradient(180deg, #0b3a22 0 10%, #0d4428 10% 20%);
      border-radius: 18px;
      border: 1px solid rgba(57,255,136,.35);
      box-shadow: inset 0 0 60px rgba(0,0,0,.65), 0 0 30px rgba(57,255,136,.08);
      overflow: hidden;
    }
    .pitch-svg line, .pitch-svg rect, .pitch-svg circle, .pitch-svg path { stroke: rgba(210,255,230,.35); stroke-width: .35; fill: none; }
    .pitch-svg .spot { fill: rgba(210,255,230,.45); stroke: none; }
    .player-chip { transition: transform .2s ease, filter .2s ease; }
    .player-chip:hover { transform: translate(-50%, -50%) scale(1.06) !important; filter: drop-shadow(0 0 10px rgba(57,255,136,.6)); }
    .shirt {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 11px; color: #05060a;
      clip-path: polygon(22% 0, 38% 8%, 62% 8%, 78% 0, 100% 18%, 88% 38%, 82% 32%, 82% 100%, 18% 100%, 18% 32%, 12% 38%, 0 18%);
    }
    @media (min-width: 640px) { .shirt { width: 52px; height: 52px; font-size: 13px; } }
    .empty-slot { width: 42px; height: 42px; border: 2px dashed rgba(57,255,136,.7); border-radius: 12px; display: grid; place-items: center; color: var(--neon); font-size: 22px; font-weight: 800; animation: pulseDot 1.6s infinite; }
    @media (min-width: 640px) { .empty-slot { width: 52px; height: 52px; } }

    .scan-wrap { position: relative; overflow: hidden; }
    .scan-line { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--neon), transparent); box-shadow: 0 0 18px var(--neon), 0 0 40px var(--neon); animation: scan 1.6s ease-in-out infinite; }

    .flash-down { animation: flashDown 1.2s ease; }

    const ids = (from, to, prefix) => Array.from({ length: to - from + 1 }, (_, i) => prefix + (from + i));

    const INITIAL_RIVALS = [
      { id: 'r1', name: 'Los Galácticos de Kike', budget: 34.6, points: 612, last: 61, squadIds: ids(1, 11, 'o') },
      { id: 'r2', name: 'Fede FC Turbo', budget: 21.3, points: 588, last: 55, squadIds: ids(1, 11, 'p') },
      { id: 'r3', name: 'Rayo Cuñao', budget: 12.8, points: 541, last: 47, squadIds: ids(12, 22, 'p') },
      { id: 'r4', name: 'Atlético Bocata', budget: 27.9, points: 575, last: 52, squadIds: ids(23, 33, 'p') },
    ];

    const INITIAL_BIDS = [
      { id: 'b1', j: 10, who: 'Los Galácticos de Kike', type: 'compra', player: 'Kylian Mbappé', amount: 28.4 },
      { id: 'b2', j: 10, who: 'Fede FC Turbo', type: 'puja', player: 'Antony', amount: 13.9 },
      { id: 'b3', j: 10, who: 'Rayo Cuñao', type: 'venta', player: 'Óscar Valentín', amount: 3.1 },
      { id: 'b4', j: 9, who: 'Atlético Bocata', type: 'puja', player: 'Nico Williams', amount: 19.0 },
      { id: 'b5', j: 9, who: 'Tú', type: 'compra', player: 'Ante Budimir', amount: 11.8 },
    ];

    const INITIAL_BUDGET = 22.0;
    const INITIAL_POINTS = 597;
    const FORMATIONS = {
      '4-3-3': { POR: 1, DEF: 4, MED: 3, DEL: 3 },
      '4-4-2': { POR: 1, DEF: 4, MED: 4, DEL: 2 },
      '3-5-2': { POR: 1, DEF: 3, MED: 5, DEL: 2 },
      '3-4-3': { POR: 1, DEF: 3, MED: 4, DEL: 3 },
      '5-3-2': { POR: 1, DEF: 5, MED: 3, DEL: 2 },
      '4-5-1': { POR: 1, DEF: 4, MED: 5, DEL: 1 },
    };
    const POSITIONS = ['POR', 'DEF', 'MED', 'DEL'];
    const POS_LABEL = { POR: 'Portero', DEF: 'Defensa', MED: 'Medio', DEL: 'Delantero' };
    const POS_COLOR = { POR: '#ffc53d', DEF: '#3fa8ff', MED: '#39ff88', DEL: '#ff3b6b' };
    const STORAGE_KEY = 'fantasy-hacker-v2';

    /* =====================================================
       MOTOR DE PROYECCIÓN
    ===================================================== */
    const DIFF_MULT = { 1: 1.3, 2: 1.15, 3: 1, 4: 0.85, 5: 0.7 };
    const HEALTH_MULT = { ok: 1, duda: 0.55, lesionado: 0, sancionado: 0 };
    const HEALTH_INFO = {
      ok: { label: 'Disponible', cls: 'text-neon', dot: 'bg-neon' },
      duda: { label: 'Duda', cls: 'text-warn', dot: 'bg-warn' },
      lesionado: { label: 'Lesionado', cls: 'text-danger', dot: 'bg-danger' },
      sancionado: { label: 'Sancionado', cls: 'text-danger', dot: 'bg-danger' },
    };
    const formAvg = (p) => mean(p.form);
    function projection(p) {
      const n = nextOf(p);
      const base = 0.45 * p.avg + 0.55 * formAvg(p);
      const m = p.last.minutes;
      const minutesFactor = m >= 70 ? 1.05 : m >= 46 ? 0.9 : m > 0 ? 0.8 : 0.85;
      return r1(base * DIFF_MULT[n.diff] * (HEALTH_MULT[p.health] ?? 1) * minutesFactor);
    }

    function autoLineup(squad, formation) {
      const need = FORMATIONS[formation];
      const picked = new Set();
      POSITIONS.forEach((pos) => {
        squad.filter((p) => p.pos === pos)
          .sort((a, b) => projection(b) - projection(a))
          .slice(0, need[pos])
          .forEach((p) => picked.add(p.id));
      });
      return squad.map((p) => ({ ...p, starter: picked.has(p.id) }));
    }
    const holesOf = (squad, formation) => {
      const need = FORMATIONS[formation];
      const h = {};
      POSITIONS.forEach((pos) => { h[pos] = Math.max(0, need[pos] - squad.filter((p) => p.starter && p.pos === pos).length); });
      return h;
    };
    function bestCaptain(squad) {
      const st = squad.filter((p) => p.starter);
      return st.length ? st.reduce((a, b) => (projection(b) > projection(a) ? b : a)) : null;
    }

    /* Historial de precios (7 días) + previsión */
    function genHist(p) {
      const rnd = seeded(p.id + p.name);
      const arr = [p.price];
      let cur = p.price;
      for (let i = 0; i < 6; i++) {
        cur = cur / (1 + p.trend / 100 / 5 + (rnd() - 0.5) * 0.02);
        arr.unshift(r2(cur));
      }
      return arr;
    }
    const histOf = (p) => (p.hist && p.hist.length >= 2 ? p.hist : genHist(p));

    /* =====================================================
       IA NARRATIVA
    ===================================================== */
    const joinEs = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1];
    function describeGood(p) {
      const r = [];
      const n = nextOf(p);
      if (p.last.goals > 0) r.push(`metió ${p.last.goals === 1 ? 'gol' : p.last.goals + ' goles'} el partido pasado`);
      if (p.last.assists > 0) r.push(`dio ${p.last.assists === 1 ? 'una asistencia' : p.last.assists + ' asistencias'}`);
      if (p.last.rating >= 7.5) r.push(`firmó un ${p.last.rating.toFixed(1)} de nota`);
      if (formAvg(p) >= 6.5) r.push(`lleva una racha oculta de ${formAvg(p).toFixed(1)} pts de media en las últimas 5`);
      if (n.diff <= 2) r.push(`su equipo (${teamOf(p.team).name}) ${n.home ? 'recibe' : 'visita'} a ${n.rival}, un rival débil (dificultad ${n.diff}/5)`);
      if (p.trend > 0) r.push(`su precio va a subir un ${p.trend}% esta semana`);
      return r;
    }
    function describeBad(p) {
      const r = [];
      const n = nextOf(p);
      if (p.health === 'lesionado') r.push('está lesionado y no sumará nada esta jornada');
      if (p.health === 'sancionado') r.push('está sancionado: 0 puntos asegurados');
      if (p.health === 'duda') r.push('es duda médica para el próximo partido');
      if (p.last.subbedAt && p.last.subbedAt <= 65) r.push(`viene de ser sustituido al minuto ${p.last.subbedAt} con un pobre ${p.last.rating.toFixed(1)} de nota`);
      if (formAvg(p) < 3) r.push(`promedia solo ${formAvg(p).toFixed(1)} pts en las últimas 5 jornadas`);
      if (n.diff >= 4) r.push(`le toca contra ${n.rival}, de los rivales más duros (dificultad ${n.diff}/5)`);
      if (p.trend < 0) r.push(`su precio caerá un ${Math.abs(p.trend)}% si no lo vendes ya`);
      return r;
    }

    function generateHacks(squad, market, budget, formation, captainId) {
      const hacks = [];
      const starters = squad.filter((p) => p.starter);
      const used = new Set();

      // Huecos en el once
      const holes = holesOf(squad, formation);
      POSITIONS.forEach((pos) => {
        if (!holes[pos]) return;
        const opts = market.filter((m) => m.pos === pos && m.health === 'ok' && m.price <= budget && !used.has(m.id))
          .sort((a, b) => projection(b) - projection(a));
        const m = opts[0];
        if (m) used.add(m.id);
        hacks.push({
          id: `fill-${pos}`, type: m ? 'fill' : 'alert', severity: 'critical', inId: m ? m.id : null,
          title: `Tienes ${holes[pos]} hueco${holes[pos] > 1 ? 's' : ''} de ${POS_LABEL[pos].toLowerCase()} en tu ${formation}`,
          why: m
            ? `Un hueco son 0 puntos seguros. ${m.name} entra en tu presupuesto (${fmtM(m.price)}) y ${joinEs(describeGood(m)) || `proyecta ${projection(m)} pts`}.`
            : `No tienes ${POS_LABEL[pos].toLowerCase()}s en el banquillo ni presupuesto para fichar uno. Cambia de formación o vende para liberar caja.`,
          impact: m ? `+${projection(m).toFixed(1)} pts · Coste ${fmtM(m.price)}` : '0 pts en esa posición',
          gain: m ? projection(m) : 0,
        });
      });

      [...starters].sort((a, b) => projection(a) - projection(b)).forEach((s) => {
        const candidates = market
          .filter((m) => m.pos === s.pos && m.health === 'ok' && !used.has(m.id) && m.price <= budget + s.price)
          .map((m) => ({ m, gain: projection(m) - projection(s) }))
          .filter((c) => c.gain >= 1.2)
          .sort((a, b) => b.gain - a.gain + (b.m.trend - a.m.trend) * 0.05);
        if (!candidates.length) return;
        const { m, gain } = candidates[0];
        used.add(m.id);
        const cost = m.price - s.price;
        hacks.push({
          id: `hack-${s.id}-${m.id}`, type: 'swap',
          severity: s.health === 'lesionado' || s.health === 'sancionado' ? 'critical' : gain >= 3 ? 'high' : 'mid',
          outId: s.id, inId: m.id,
          title: `Cambia a ${s.name} por ${m.name}`,
          why: `El jugador del mercado ${joinEs(describeGood(m)) || 'tiene mejor proyección'}. En cambio, tu titular ${joinEs(describeBad(s)) || 'rinde por debajo de su alternativa'}.`,
          impact: `+${gain.toFixed(1)} pts proyectados · ${cost >= 0 ? 'Coste neto ' + fmtM(cost) : 'Liberas ' + fmtM(-cost)}`,
          gain,
        });
      });

      starters.forEach((s) => {
        if ((s.health === 'lesionado' || s.health === 'sancionado') && !hacks.find((h) => h.outId === s.id)) {
          const bench = squad.find((b) => !b.starter && b.pos === s.pos && b.health === 'ok');
          hacks.push({
            id: `alert-${s.id}`, type: bench ? 'bench' : 'alert', severity: 'critical', outId: s.id, inId: bench ? bench.id : null,
            title: `${s.name} ${s.health === 'lesionado' ? 'LESIONADO' : 'SANCIONADO'} en tu once`,
            why: bench
              ? `No hay fichaje rentable en tu presupuesto, pero ${bench.name} está en tu banquillo y suma ${projection(bench).toFixed(1)} pts proyectados frente a 0.`
              : `Ahora mismo te da 0 puntos y no hay sustituto en caja. Vende para liberar ${fmtM(s.price)} antes de que su precio caiga un ${Math.abs(s.trend)}%.`,
            impact: bench ? `+${projection(bench).toFixed(1)} pts al instante` : 'Riesgo de 0 puntos', gain: bench ? projection(bench) : 0,
          });
        }
      });

      // Capitán
      const best = bestCaptain(squad);
      const cap = squad.find((p) => p.id === captainId && p.starter);
      if (best && (!cap || projection(best) - projection(cap) >= 1)) {
        hacks.push({
          id: `cap-${best.id}`, type: 'captain', severity: 'high', inId: best.id,
          title: `Dale el brazalete a ${best.name}`,
          why: `El capitán puntúa doble. ${best.name} es tu titular con mejor proyección (${projection(best)} pts) porque ${joinEs(describeGood(best)) || 'llega en buena forma'}.${cap ? ` ${cap.short} solo proyecta ${projection(cap)} pts.` : ' Ahora mismo no tienes capitán.'}`,
          impact: `+${(projection(best) - (cap ? projection(cap) : 0)).toFixed(1)} pts extra por el x2`,
          gain: projection(best) - (cap ? projection(cap) : 0),
        });
      }

      squad.filter((p) => p.trend >= 4 && p.health === 'ok').slice(0, 2).forEach((p) => {
        hacks.push({
          id: `hold-${p.id}`, type: 'hold', severity: 'info', outId: p.id,
          title: `Blinda a ${p.name}`,
          why: `${joinEs(describeGood(p)) || 'Está en forma'}. Venderlo ahora sería regalar su revalorización a la liga. Ponle precio de guerra en la calculadora de cláusulas.`,
          impact: `Revalorización estimada ${fmtM(p.price * p.trend / 100)}`, gain: 0,
        });
      });

      const order = { critical: 0, high: 1, mid: 2, info: 3 };
      return hacks.sort((a, b) => order[a.severity] - order[b.severity] || b.gain - a.gain);
    }

    function generateCards(squad, market) {
      const buy = market.filter((m) => m.health === 'ok' && (m.trend >= 6 || formAvg(m) >= 6.5))
        .sort((a, b) => b.trend + formAvg(b) - (a.trend + formAvg(a))).slice(0, 6)
        .map((p) => ({ p, reason: p.trend >= 9 ? `Aceleración de mercado +${p.trend}%` : `Racha oculta: ${formAvg(p).toFixed(1)} pts/partido` }));
      const sell = squad.filter((p) => p.trend <= -3 || p.health === 'lesionado' || p.health === 'sancionado' || formAvg(p) < 2.5)
        .sort((a, b) => a.trend - b.trend)
        .map((p) => ({ p, reason: p.health === 'lesionado' ? 'Lesión: valor en caída libre' : p.health === 'sancionado' ? 'Sancionado esta jornada' : `Precio cayendo ${p.trend}%` }));
      const sellIds = new Set(sell.map((s) => s.p.id));
      const hold = squad.filter((p) => !sellIds.has(p.id)).sort((a, b) => projection(b) - projection(a)).slice(0, 6)
        .map((p) => ({ p, reason: p.trend > 0 ? `Revalorizando +${p.trend}%` : `Proyección sólida: ${projection(p)} pts` }));
      return { buy, sell, hold };
    }

    /* =====================================================
       SIMULADOR DE JORNADA
    ===================================================== */
    function simPoints(p) {
      if (HEALTH_MULT[p.health] === 0) return { pts: 0, events: [p.health === 'lesionado' ? '🚑 No jugó' : '🟥 Sancionado'] };
      if (p.health === 'duda' && Math.random() < 0.4) return { pts: 0, events: ['🩹 No convocado'] };
      const pts = Math.round(clamp(projection(p) + gauss() * 3.2, -3, 22));
      const events = [];
      if (pts >= 10) events.push('⚽ Gol');
      if (pts >= 13) events.push('⚽ Doblete');
      if (pts >= 7 && pts < 13 && Math.random() < 0.5) events.push('🅰️ Asistencia');
      if (p.pos === 'POR' && pts >= 6) events.push('🧤 Portería a 0');
      if (pts <= 1) events.push(Math.random() < 0.5 ? '🟨 Amarilla' : '🔄 Cambiado pronto');
      return { pts, events };
    }
    function simulateMatchday(squad, captainId, rivals) {
      const starters = squad.filter((p) => p.starter);
      const rows = starters.map((p) => {
        const { pts, events } = simPoints(p);
        const captain = p.id === captainId;
        return { p, pts, events, captain, total: captain ? pts * 2 : pts };
      }).sort((a, b) => b.total - a.total);
      const mine = rows.reduce((s, r) => s + r.total, 0);
      const rivalRows = rivals.map((r) => {
        const sq = r.squadIds.map((id) => DB[id]).filter(Boolean);
        const pts = sq.map((p) => simPoints(p).pts);
        const best = Math.max(0, ...pts);
        return { id: r.id, name: r.name, pts: pts.reduce((s, x) => s + x, 0) + best };
      });
      return { rows, mine, rivalRows };
    }
    // Evoluciona a un jugador tras la jornada: forma, precio, tendencia y salud
    function evolvePlayer(p, pts) {
      const rnd = Math.random();
      const avg = r1(p.avg * 0.85 + pts * 0.15);
      const price = r1(Math.max(0.5, p.price * (1 + p.trend / 100)));
      const trend = clamp(Math.round((pts - p.avg) * 2.2 + (rnd - 0.5) * 4), -12, 15);
      let health = p.health;
      if (health === 'lesionado') health = rnd < 0.45 ? 'duda' : 'lesionado';
      else if (health === 'duda') health = rnd < 0.6 ? 'ok' : 'duda';
      else if (health === 'sancionado') health = 'ok';
      else if (rnd < 0.04) health = 'duda';
      else if (rnd > 0.985) health = 'lesionado';
      const played = HEALTH_MULT[p.health] > 0 && pts !== 0;
      const sub = played && pts < 3 ? 45 + Math.floor(Math.random() * 25) : null;
      return {
        ...p, avg, price, trend, health, points: p.points + pts,
        form: [...p.form.slice(1), Math.max(0, pts)],
        hist: [...histOf(p).slice(1), price],
        last: {
          goals: pts >= 13 ? 2 : pts >= 10 ? 1 : 0, assists: pts >= 7 && pts < 10 ? 1 : 0,
          minutes: played ? (sub || 90) : 0, subbedAt: sub, rating: played ? r1(clamp(5 + pts * 0.3, 4, 9.8)) : 0,
        },
      };
    }

    /* =====================================================
       OCR REAL: TESSERACT.JS Y CLAUDE VISION
    ===================================================== */
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('No se pudo cargar ' + src));
        document.head.appendChild(s);
      });
    }
    function matchPlayersInText(text) {
      const t = ' ' + norm(text).replace(/[^a-z0-9ñ. ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
      const found = [];
      const seen = new Set();
      ALL_PLAYERS.forEach((p) => {
        const keys = [norm(p.short), norm(p.name)];
        const surname = norm(p.name).split(' ').slice(-1)[0];
        if (surname.length >= 5) keys.push(surname);
        if (keys.some((k) => k.length >= 4 && t.includes(' ' + k + ' ')) && !seen.has(p.name)) {
          seen.add(p.name); found.push(p);
        }
      });
      return found;
    }
    function shrinkImage(dataUrl, max = 1568) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.9));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }
    const teamCodeFromName = (s) => {
      const n = norm(s);
      if (!n) return 'UNK';
      const up = String(s).toUpperCase();
      if (TEAMS[up]) return up;
      return TEAM_CODES.find((c) => norm(TEAMS[c].name).includes(n) || n.includes(norm(TEAMS[c].name))) || String(s).slice(0, 14);
    };
    function playerFromExtraction(raw, i) {
      const n = norm(raw.name);
      const known = ALL_PLAYERS.find((p) => norm(p.name) === n || norm(p.short) === n || (n.length >= 5 && (norm(p.name).includes(n) || n.includes(norm(p.name)))));
      if (known) {
        return { ...known, price: raw.price_millions > 0 ? r1(raw.price_millions) : known.price, points: raw.points > 0 ? raw.points : known.points };
      }
      const avg = raw.points > 0 ? r1(clamp(raw.points / 10, 1, 9)) : 4.5;
      return {
        id: uid('cv'), name: raw.name, short: raw.name.split(' ').slice(-1)[0], team: teamCodeFromName(raw.team),
        pos: POSITIONS.includes(raw.position) ? raw.position : 'MED', price: raw.price_millions > 0 ? r1(raw.price_millions) : 5,
        points: raw.points || 0, avg, form: Array(5).fill(Math.round(avg)), health: 'ok', trend: 0,
        last: { goals: 0, assists: 0, minutes: 90, subbedAt: null, rating: 6.5 },
      };
    }
    async function claudeVisionExtract(apiKey, dataUrl, mode) {
      const small = await shrinkImage(dataUrl);
      const [meta, b64] = small.split(',');
      const mediaType = meta.match(/data:(.*?);/)[1];
      const schema = {
        type: 'object', additionalProperties: false, required: ['players', 'budget_millions'],
        properties: {
          budget_millions: { type: 'number' },
          players: {
            type: 'array',
            items: {
              type: 'object', additionalProperties: false,
              required: ['name', 'team', 'position', 'price_millions', 'points'],
              properties: {
                name: { type: 'string' },
                team: { type: 'string' },
                position: { type: 'string', enum: ['POR', 'DEF', 'MED', 'DEL'] },
                price_millions: { type: 'number' },
                points: { type: 'number' },
              },
            },
          },
        },
      };
      const prompt = mode === 'team'
        ? 'Esta es una captura de mi plantilla en una app de fútbol fantasy (LaLiga Fantasy, Biwenger o similar). Extrae todos los jugadores visibles: nombre completo, equipo de LaLiga, posición (POR, DEF, MED o DEL), precio en millones de euros y puntos totales. Si un dato no se ve, pon 0. Si aparece el saldo o presupuesto disponible, ponlo en budget_millions; si no, 0.'
        : 'Esta es una captura del mercado de fichajes de una app de fútbol fantasy (LaLiga Fantasy, Biwenger o similar). Extrae todos los jugadores en venta: nombre completo, equipo de LaLiga, posición (POR, DEF, MED o DEL), precio en millones de euros y puntos totales. Si un dato no se ve, pon 0. budget_millions: 0.';
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2026-10-21',
          'anthropic-beta': 'server-side-fallback-2026-07-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-opus-5-5',
          max_tokens: 16000,
          output_config: { effort: 'low', format: { type: 'json_schema', schema } },
          fallbacks: 'default',
          messages: [{ role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
            { type: 'text', text: prompt },
          ] }],
        }),
      });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const e = await res.json(); msg = e.error?.message || msg; } catch (e) { /* sin cuerpo */ }
        throw new Error(res.status === 401 ? 'API key inválida' : msg);
      }
      const data = await res.json();
      if (data.stop_reason === 'refusal') throw new Error('Claude no pudo analizar esta imagen');
      if (data.stop_reason === 'max_tokens') throw new Error('Respuesta incompleta, prueba con una captura más pequeña');
      const text = data.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
      const parsed = JSON.parse(text);
      return { players: (parsed.players || []).map(playerFromExtraction), budget: parsed.budget_millions || 0 };
    }

    /* Importación de datos externos (JSON propio o de una API) */
    function normalizePlayer(raw, i) {
      const avg = Number(raw.avg) || (raw.points ? r1(raw.points / 10) : 4);
      const form = Array.isArray(raw.form) && raw.form.length ? raw.form.slice(-5).map(Number) : Array(5).fill(Math.round(avg));
      while (form.length < 5) form.unshift(Math.round(avg));
      return {
        id: String(raw.id || 'imp' + i + '-' + Date.now()), name: String(raw.name || 'Jugador ' + (i + 1)),
        short: String(raw.short || String(raw.name || 'Jugador').split(' ').slice(-1)[0]),

        price: Number(raw.price) || 5, points: Number(raw.points) || 0, avg, form,
        health: HEALTH_INFO[raw.health] ? raw.health : 'ok', trend: Number(raw.trend) || 0, starter: !!raw.starter,

    function nextMarketClose(now = new Date()) {
      const d = new Date(now);
      d.setHours(21, 0, 0, 0);
      const add = (5 - d.getDay() + 7) % 7; // viernes a las 21:00
      d.setDate(d.getDate() + add);
      if (d <= now) d.setDate(d.getDate() + 7);
      return d;
    }
    const fmtCountdown = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      const pad = (x) => String(x).padStart(2, '0');
      return `${d > 0 ? d + 'd ' : ''}${pad(h)}:${pad(m)}:${pad(sec)}`;
    };
    function systemNotify(title, body) {
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, { body, tag: title });
          return true;
        }
      } catch (e) { /* algunos móviles solo permiten avisos con service worker */ }
      return false;
    }

    /* Gráfica de precio: 7 días + previsión (línea discontinua) */
    function PriceChart({ p, w = 120, h = 36, big = false }) {
      const hist = histOf(p);
      const forecast = r2(p.price * (1 + p.trend / 100));
      const all = [...hist, forecast];
      const min = Math.min(...all), max = Math.max(...all);
      const pad = (max - min) * 0.15 || 0.2;
      const lo = min - pad, hi = max + pad;
      const padX = big ? 34 : 2, padY = big ? 14 : 3;
      const X = (i) => padX + (i / (all.length - 1)) * (w - padX - 4);
      const Y = (v) => padY + (1 - (v - lo) / (hi - lo)) * (h - padY * 2);
      const pts = hist.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
      const up = forecast >= hist[hist.length - 1];
      const color = p.trend > 0 ? '#39ff88' : p.trend < 0 ? '#ff3b6b' : '#94a3b8';
      const days = ['-6d', '-5d', '-4d', '-3d', '-2d', 'Ayer', 'Hoy', 'Prev.'];
      return (
        <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={big ? h : undefined} className={big ? '' : 'w-full h-9'} preserveAspectRatio="none" role="img" aria-label={`Precio de ${p.name}`}>
          {big && [lo + (hi - lo) * 0.25, lo + (hi - lo) * 0.75].map((v, i) => (
            <g key={i}>
              <line x1={padX} x2={w - 4} y1={Y(v)} y2={Y(v)} stroke="rgba(255,255,255,.07)" />
              <text x={2} y={Y(v) + 3} fill="#64748b" fontSize="9" fontFamily="JetBrains Mono">{v.toFixed(1)}</text>
            </g>
          ))}
          <polyline points={`${X(0)},${h} ${pts} ${X(hist.length - 1)},${h}`} fill={color} opacity="0.08" stroke="none" />
          <polyline points={pts} fill="none" stroke={color} strokeWidth={big ? 2 : 1.5} strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
          <line x1={X(hist.length - 1)} y1={Y(hist[hist.length - 1])} x2={X(all.length - 1)} y2={Y(forecast)} stroke={up ? '#39ff88' : '#ff3b6b'} strokeWidth={big ? 2 : 1.5} strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />
          <circle cx={X(all.length - 1)} cy={Y(forecast)} r={big ? 3.5 : 2} fill={up ? '#39ff88' : '#ff3b6b'} />
          {big && all.map((v, i) => (
            <text key={i} x={X(i)} y={h - 1} fill={i === all.length - 1 ? '#b026ff' : '#64748b'} fontSize="8.5" textAnchor="middle" fontFamily="JetBrains Mono">{days[i]}</text>
          ))}
        </svg>
      );
    }

    /* =====================================================
       ZONA DE CARGA + OCR (DEMO / TESSERACT / CLAUDE)
    ===================================================== */
    const OCR_SCRIPTS = {
      team: ['> Cargando modelo de visión «HackerVision-v4»…', '> Preprocesando imagen: contraste +32%, desenfoque −0.8', '> Detectando bloques de texto… 47 regiones', '> Reconociendo dorsales y nombres… 14 jugadores', '> Cruzando con base de datos de LaLiga… 100% match', '> Leyendo precios, puntos y estado médico…', '> Alineación óptima calculada ✔'],
      market: ['> Cargando modelo de visión «HackerVision-v4»…', '> Segmentando tarjetas del mercado… 5 detectadas', '> OCR de precios y pujas mínimas…', '> Analizando velocidad de subida de precio (Δ 24h)…', '> Detectando rachas ocultas en las últimas 5 jornadas…', '> Inyectando oportunidades en el mercado ✔'],
    };
    const ENGINES = [
      { id: 'demo', label: 'Demo', desc: 'Simulación con captura de ejemplo' },
      { id: 'tesseract', label: 'OCR real', desc: 'Tesseract.js en tu navegador, gratis' },
      { id: 'claude', label: 'Claude Vision', desc: 'IA de Anthropic, necesita API key' },
    ];

    function UploadZone({ onAnalyzed, toast }) {
      const [mode, setMode] = useState('team');
      const [engine, setEngine] = useState(() => { try { return localStorage.getItem('fh-engine') || 'demo'; } catch (e) { return 'demo'; } });
      const [preview, setPreview] = useState({ team: null, market: null });
      const [drag, setDrag] = useState(false);
      const [scanning, setScanning] = useState(false);
      const [log, setLog] = useState([]);
      const [progress, setProgress] = useState(0);
      const [apiKey, setApiKey] = useState(loadKey);
      const [remember, setRemember] = useState(() => { try { return !!localStorage.getItem('fh-key'); } catch (e) { return false; } });
      const inputRef = useRef(null);
      const timers = useRef([]);

      useEffect(() => () => timers.current.forEach(clearTimeout), []);
      useEffect(() => { try { localStorage.setItem('fh-engine', engine); } catch (e) { /* sin almacenamiento */ } }, [engine]);

      const readFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => setPreview((p) => ({ ...p, [mode]: e.target.result }));
        reader.readAsDataURL(file);
      };
      const addLog = (l) => setLog((x) => [...x, l]);

      const runDemo = () => {
        const script = OCR_SCRIPTS[mode];
        script.forEach((line, i) => {
          timers.current.push(setTimeout(() => { addLog(line); setProgress(Math.round(((i + 1) / script.length) * 100)); }, 380 * (i + 1)));
        });
        timers.current.push(setTimeout(() => { setScanning(false); onAnalyzed(mode, null); }, 380 * (script.length + 1) + 200));
      };

      const runTesseract = async (img) => {
        try {
          addLog('> Cargando Tesseract.js (primera vez ~10 MB)…');
          await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
          addLog('> Descargando idioma español…');
          const worker = await window.Tesseract.createWorker('spa', 1, {
            logger: (m) => { if (m.status === 'recognizing text') setProgress(Math.round(m.progress * 100)); },
          });
          addLog('> Leyendo texto de la captura…');
          const { data } = await worker.recognize(img);
          await worker.terminate();
          const words = data.text.split(/\s+/).filter(Boolean).length;
          addLog(`> ${words} palabras leídas. Buscando jugadores de LaLiga…`);
          const players = matchPlayersInText(data.text);
          addLog(`> ${players.length} jugadores reconocidos${players.length ? ': ' + players.slice(0, 6).map((p) => p.short).join(', ') + (players.length > 6 ? '…' : '') : ''}`);
          if (mode === 'team' && players.length < 5) throw new Error(`Solo reconocí ${players.length} jugadores. Prueba con una captura más nítida o con Claude Vision.`);
          if (!players.length) throw new Error('No reconocí ningún jugador. Prueba con Claude Vision.');
          addLog('> Datos aplicados ✔');
          setProgress(100);
          onAnalyzed(mode, { players, budget: 0, source: 'OCR' });
        } catch (e) {
          addLog('✖ ' + e.message); toast(e.message, 'error');
        } finally { setScanning(false); }
      };

      const runClaude = async (img) => {
        if (!apiKey.trim()) { setScanning(false); toast('Escribe tu API key de Anthropic', 'error'); return; }
        storeKey(apiKey.trim(), remember);
        let p = 5;
        const tick = setInterval(() => { p = Math.min(92, p + 4); setProgress(p); }, 500);
        try {
          addLog('> Comprimiendo imagen y enviándola a Claude…');
          addLog('> Claude está leyendo nombres, posiciones y precios…');
          const { players, budget } = await claudeVisionExtract(apiKey.trim(), img, mode);
          addLog(`> ${players.length} jugadores extraídos${players.length ? ': ' + players.slice(0, 6).map((x) => x.short).join(', ') + (players.length > 6 ? '…' : '') : ''}`);
          if (budget > 0) addLog(`> Presupuesto detectado: ${fmtM(budget)}`);
          if (!players.length) throw new Error('Claude no encontró jugadores en la imagen.');
          setProgress(100);
          addLog('> Datos aplicados ✔');
          onAnalyzed(mode, { players, budget, source: 'Claude' });
        } catch (e) {
          addLog('✖ ' + e.message); toast(e.message, 'error');
        } finally { clearInterval(tick); setScanning(false); }
      };

      const analyze = () => {
        const img = preview[mode];
        if (engine !== 'demo' && !img) { toast('Sube primero una captura', 'error'); return; }
        setScanning(true); setLog([]); setProgress(0);
        if (engine === 'demo') runDemo();
        else if (engine === 'tesseract') runTesseract(img);
        else runClaude(img);
      };

      const current = preview[mode];
      return (
        <section className="card p-4 sm:p-5 glow-green relative overflow-hidden">
          <div className="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-neon/10 blur-3xl pointer-events-none" />
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 relative">
            <div>
              <h2 className="font-display font-bold text-base sm:text-lg tracking-wide text-white flex items-center gap-2">
                <Icon name="scan" className="w-5 h-5 text-neon" /> VISIÓN IA · OCR
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">Sube una captura de tu app fantasy y la IA la convierte en datos accionables.</p>
            </div>
            <div className="grid grid-cols-2 p-1 rounded-xl bg-black/40 border border-white/10 text-xs font-semibold">
              {[['team', 'Imagen de Equipo'], ['market', 'Imagen de Mercado']].map(([k, l]) => (
                <button key={k} onClick={() => !scanning && setMode(k)}
                  className={`px-3 py-2 rounded-lg transition ${mode === k ? 'bg-neon text-void shadow-[0_0_14px_rgba(57,255,136,.5)]' : 'text-slate-400 hover:text-white'}`}>{l}</button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 mb-4 relative">
            {ENGINES.map((e) => (
              <button key={e.id} disabled={scanning} onClick={() => setEngine(e.id)}
                className={`text-left rounded-xl border px-2.5 py-2 transition ${engine === e.id ? 'border-hack bg-hack/15 glow-purple' : 'border-white/10 bg-black/30 hover:border-white/25'}`}>
                <div className="text-xs font-bold text-white">{e.label}</div>
                <div className="text-[10px] text-slate-400 leading-tight mt-0.5">{e.desc}</div>
              </button>
            ))}
          </div>

          {engine === 'claude' && (
            <div className="mb-4 rounded-xl border border-hack/30 bg-hack/[.05] p-3 relative">
              <label className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">API key de Anthropic</label>
              <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="sk-ant-…" className="field mt-1 font-mono" autoComplete="off" />
              <label className="flex items-center gap-2 mt-2 text-xs text-slate-400">
                <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} /> Recordar en este dispositivo
              </label>
              <p className="text-[11px] text-slate-500 mt-1.5 leading-relaxed">
                La key se envía directamente desde tu navegador a api.anthropic.com y solo se guarda aquí. Úsala solo en tu propio dispositivo. Cada análisis cuesta unos céntimos de tu cuenta.
              </p>
            </div>
          )}

          <div className="grid md:grid-cols-[1.1fr_1fr] gap-4 relative">
            <div
              onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={(e) => { e.preventDefault(); setDrag(false); readFile(e.dataTransfer.files[0]); }}
              onClick={() => !scanning && inputRef.current?.click()}
              className={`scan-wrap cursor-pointer rounded-2xl border-2 border-dashed border-white/15 hover:border-neon/60 transition min-h-[180px] grid place-items-center text-center bg-black/30 ${drag ? 'dropzone-active' : ''}`}>
              <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={(e) => readFile(e.target.files[0])} />
              {current ? (
                <img src={current} alt="Captura subida" className="absolute inset-0 w-full h-full object-cover opacity-70" />
              ) : (
                <div className="px-4 py-6">
                  <div className="mx-auto w-14 h-14 rounded-2xl grid place-items-center bg-neon/10 text-neon mb-3 glow-green">
                    <Icon name={mode === 'team' ? 'upload' : 'image'} className="w-7 h-7" />
                  </div>
                  <p className="font-semibold text-white">{mode === 'team' ? 'Subir Imagen de Equipo' : 'Subir Imagen de Mercado'}</p>
                  <p className="text-xs text-slate-400 mt-1">Arrastra una captura o toca para elegir (PNG/JPG)</p>
                  {engine === 'demo' && <p className="text-[11px] text-slate-500 mt-2 font-mono">Modo demo: sin imagen usa una captura de ejemplo</p>}
                </div>
              )}
              {scanning && (<><div className="scan-grid" /><div className="scan-line" /></>)}
              {current && !scanning && <span className="absolute bottom-2 left-2 text-[11px] font-mono bg-black/70 px-2 py-1 rounded text-neon">Imagen lista ✔ · toca para cambiar</span>}
            </div>

            <div className="flex flex-col gap-3">
              <div className="flex-1 rounded-2xl bg-black/60 border border-neon/20 p-3 font-mono text-[11px] sm:text-xs text-neon/90 min-h-[140px] max-h-[200px] overflow-auto">
                {log.length === 0 && !scanning && <p className="text-slate-500">$ hacker-vision --mode={mode} --engine={engine} <span className="blink">▌</span></p>}
                {log.map((l, i) => <p key={i} className={`fade-in leading-relaxed ${l.startsWith('✖') ? 'text-danger' : ''}`}>{l}</p>)}
                {scanning && <p className="blink">▌</p>}
              </div>
              <div className="h-1.5 rounded-full bg-white/5 overflow-hidden">
                <div className="h-full bg-gradient-to-r from-neon to-hack transition-all duration-300" style={{ width: `${progress}%` }} />
              </div>
              <button onClick={analyze} disabled={scanning} className="btn-neon rounded-xl py-3 px-4 flex items-center justify-center gap-2 text-sm">
                <Icon name="scan" className="w-4 h-4" /> {scanning ? `Analizando… ${progress}%` : 'Analizar con IA'}
              </button>
            </div>
          </div>
        </section>
      );
    }

    /* =====================================================
       FEED DEL HACKER Y RADAR
    ===================================================== */
    function HackerFeed({ hacks, onExecute, lookup }) {
      const style = {
        critical: { emoji: '🔴', label: 'ALERTA CRÍTICA', cls: 'border-danger/60 bg-danger/5', tag: 'text-danger' },
        high: { emoji: '🟢', label: 'HACK SUGERIDO', cls: 'border-neon/50 bg-neon/[.04]', tag: 'text-neon' },
        mid: { emoji: '🟢', label: 'HACK SUGERIDO', cls: 'border-hack/50 bg-hack/[.06]', tag: 'text-neon' },
        info: { emoji: '🟡', label: 'MANTÉN Y BLINDA', cls: 'border-warn/40 bg-warn/[.04]', tag: 'text-warn' },
      };
      const actionLabel = { swap: 'Ejecutar hack ⚡', bench: 'Alinear suplente ⚡', fill: 'Fichar y alinear ⚡', captain: 'Poner brazalete ©' };
      return (
        <section className="card-purple p-4 sm:p-5">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display font-bold text-base sm:text-lg tracking-wide text-hack glow-text-purple flex items-center gap-2">
              <Icon name="bolt" className="w-5 h-5" /> FEED DEL HACKER
            </h2>
            <span className="font-mono text-[11px] text-hack/80 border border-hack/40 rounded-full px-2 py-0.5">{hacks.length} órdenes</span>
          </div>
          <div className="space-y-3 max-h-[680px] overflow-auto pr-1">
            {hacks.length === 0 && <p className="text-sm text-slate-400 font-mono">✔ Tu once está optimizado. La IA sigue vigilando el mercado…</p>}
            {hacks.map((h) => {
              const s = style[h.severity];
              const out = h.outId ? lookup[h.outId] : null;
              const inn = h.inId ? lookup[h.inId] : null;
              return (
                <article key={h.id} className={`fade-in rounded-2xl border p-3.5 ${s.cls}`}>
                  <div className={`font-mono text-[11px] font-semibold tracking-wider ${s.tag}`}>{s.emoji} {s.label}</div>
                  <h3 className="font-bold text-white mt-1 leading-snug">{h.title}</h3>
                  <p className="text-sm text-slate-300 mt-1.5 leading-relaxed"><span className="text-hack font-semibold">¿Por qué? </span>{h.why}</p>
                  {out && inn && h.type !== 'captain' && (
                    <div className="mt-3 flex items-center gap-2 text-xs">
                      <MiniPlayer p={out} tone="out" />
                      <Icon name="swap" className="w-4 h-4 text-hack shrink-0" />
                      <MiniPlayer p={inn} tone="in" />
                    </div>
                  )}
                  <div className="mt-3 flex flex-wrap items-center justify-between gap-2">
                    <span className="font-mono text-[11px] text-neon">{h.impact}</span>
                    {actionLabel[h.type] && <button onClick={() => onExecute(h)} className="btn-hack text-xs rounded-lg px-3 py-1.5">{actionLabel[h.type]}</button>}
                  </div>
                </article>
              );
            })}
          </div>
        </section>
      );
    }
    function MiniPlayer({ p, tone }) {
      return (
        <div className={`flex-1 min-w-0 rounded-lg px-2 py-1.5 border ${tone === 'out' ? 'border-danger/40 bg-danger/5' : 'border-neon/40 bg-neon/5'}`}>
          <div className="flex items-center gap-1.5"><HealthDot health={p.health} /><span className="font-semibold text-white truncate">{p.short}</span></div>
          <div className="font-mono text-[10px] text-slate-400">{fmtM(p.price)} · {projection(p)} pts</div>
        </div>
      );
    }

    function RecommendationCards({ cards }) {
      const cols = [
        { key: 'buy', title: 'COMPRAR', cls: 'text-neon', border: 'border-neon/40', bg: 'bg-neon/[.04]' },
        { key: 'sell', title: 'VENDER', cls: 'text-danger', border: 'border-danger/40', bg: 'bg-danger/[.04]' },
        { key: 'hold', title: 'MANTENER', cls: 'text-warn', border: 'border-warn/40', bg: 'bg-warn/[.03]' },
      ];
      return (
        <section className="card p-4 sm:p-5">
          <SectionTitle icon="chart">RADAR DE MERCADO</SectionTitle>
          <div className="grid gap-3 md:grid-cols-3">
            {cols.map((c) => (
              <div key={c.key} className={`rounded-2xl border ${c.border} ${c.bg} p-3`}>
                <div className="flex items-center justify-between mb-2">
                  <span className={`font-display font-black text-sm tracking-widest ${c.cls}`}>{c.title}</span>
                  <span className="font-mono text-[11px] text-slate-500">{cards[c.key].length}</span>
                </div>
                <ul className="space-y-2">
                  {cards[c.key].length === 0 && <li className="text-xs text-slate-500">Nada por aquí.</li>}
                  {cards[c.key].map(({ p, reason }) => (
                    <li key={p.id} className="rounded-xl bg-black/40 border border-white/5 p-2.5">
                      <div className="flex items-center justify-between gap-2">
                        <div className="flex items-center gap-1.5 min-w-0">
                          <PosTag pos={p.pos} />
                          <span className="font-semibold text-sm text-white truncate">{p.short}</span>
                          {p.isNew && <span className="text-[9px] font-mono text-hack border border-hack/50 rounded px-1">OCR</span>}
                        </div>
                        <TrendTag trend={p.trend} />
                      </div>
                      <div className="mt-1.5 flex items-center justify-between gap-2">
                        <span className="text-[11px] text-slate-400 truncate">{reason}</span>
                        <FormBars form={p.form} />
                      </div>
                      <div className="mt-1 font-mono text-[10px] text-slate-500">{teamOf(p.team).name} · {fmtM(p.price)} · {projection(p)} pts proy.</div>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </section>
      );
    }

    /* =====================================================
       CAMPO (FORMACIÓN + CAPITÁN)
    ===================================================== */
    function Pitch({ squad, formation, setFormation, captainId, onSelect, onEmpty, projTotal, onAuto }) {
      const starters = squad.filter((p) => p.starter);
      const rows = ['DEL', 'MED', 'DEF', 'POR'];
      const rowY = { DEL: 15, MED: 40, DEF: 65, POR: 88 };
      const need = FORMATIONS[formation];
      const bench = squad.filter((p) => !p.starter);
      return (
        <section className="card p-4 sm:p-5">
          <div className="flex flex-wrap items-start justify-between gap-3 mb-3">
            <h2 className="font-display font-bold text-base sm:text-lg tracking-wide text-white flex items-center gap-2">
              <Icon name="target" className="w-5 h-5 text-neon" /> TU ONCE
            </h2>
            <div className="text-right">
              <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Proyección (capitán x2)</div>
              <div key={projTotal} className="font-display font-black text-neon glow-text-green text-lg bump">{projTotal.toFixed(1)} pts</div>
            </div>
          </div>
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar mb-3">
            {Object.keys(FORMATIONS).map((f) => (
              <button key={f} onClick={() => setFormation(f)}
                className={`shrink-0 font-mono text-xs px-3 py-1.5 rounded-lg border transition ${formation === f ? 'border-neon bg-neon/15 text-neon' : 'border-white/10 text-slate-400 hover:text-white'}`}>{f}</button>
            ))}
            <button onClick={onAuto} className="shrink-0 text-xs px-3 py-1.5 rounded-lg btn-hack">Auto-alinear IA</button>
          </div>

          <div className="pitch w-full aspect-[3/4] sm:aspect-[4/5] max-h-[640px] mx-auto">
            <svg className="pitch-svg absolute inset-0 w-full h-full" viewBox="0 0 68 105" preserveAspectRatio="none">
              <rect x="2" y="2" width="64" height="101" />
              <line x1="2" y1="52.5" x2="66" y2="52.5" />
              <circle cx="34" cy="52.5" r="9.15" />
              <circle className="spot" cx="34" cy="52.5" r="0.6" />
              <rect x="13.85" y="2" width="40.3" height="16.5" />
              <rect x="24.85" y="2" width="18.3" height="5.5" />
              <circle className="spot" cx="34" cy="13" r="0.5" />
              <path d="M26.7 18.5 A9.15 9.15 0 0 0 41.3 18.5" />
              <rect x="13.85" y="86.5" width="40.3" height="16.5" />
              <rect x="24.85" y="97.5" width="18.3" height="5.5" />
              <circle className="spot" cx="34" cy="92" r="0.5" />
              <path d="M26.7 86.5 A9.15 9.15 0 0 1 41.3 86.5" />
            </svg>
            {rows.map((pos) => {
              const line = starters.filter((p) => p.pos === pos);
              const slots = [...line, ...Array(Math.max(0, need[pos] - line.length)).fill(null)];
              return slots.map((p, i) => {
                const x = ((i + 1) / (slots.length + 1)) * 100;
                const style = { left: `${x}%`, top: `${rowY[pos]}%`, transform: 'translate(-50%, -50%)' };
                if (!p) {
                  return (
                    <button key={`empty-${pos}-${i}`} onClick={() => onEmpty(pos)} className="player-chip absolute flex flex-col items-center gap-1" style={style}>
                      <div className="empty-slot">+</div>
                      <div className="bg-black/75 border border-neon/40 rounded-md px-1.5 py-0.5 text-[10px] text-neon font-semibold">Fichar {pos}</div>
                    </button>
                  );
                }
                const proj = projection(p);
                const cap = p.id === captainId;
                return (
                  <button key={p.id} onClick={() => onSelect(p.id)} className="player-chip absolute flex flex-col items-center gap-1" style={style}>
                    <div className="relative">
                      <div className="shirt" style={{ background: teamOf(p.team).color }}>{String(p.team).slice(0, 3)}</div>
                      {cap && <span className="absolute -top-1 -left-1 w-5 h-5 rounded-full grid place-items-center text-[10px] font-black bg-hack text-white shadow-[0_0_10px_#b026ff]">C</span>}
                      {p.health !== 'ok' && (
                        <span className={`absolute -top-1 -right-1 w-4 h-4 rounded-full grid place-items-center text-[9px] font-black text-void ${p.health === 'duda' ? 'bg-warn' : 'bg-danger'}`}>{p.health === 'duda' ? '?' : '+'}</span>
                      )}
                    </div>
                    <div className="bg-black/75 border border-white/10 rounded-md px-1.5 py-0.5 text-center leading-tight max-w-[78px]">
                      <div className="text-[10px] sm:text-[11px] font-semibold text-white truncate">{p.short}</div>
                      <div className={`font-mono text-[10px] ${proj >= 6 ? 'text-neon' : proj >= 3.5 ? 'text-warn' : 'text-danger'}`}>{cap ? `${(proj * 2).toFixed(1)}` : proj.toFixed(1)} pts</div>
                    </div>
                  </button>
                );
              });
            })}
          </div>

          <div className="mt-4">
            <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Banquillo</div>
            <div className="flex gap-2 overflow-x-auto pb-1">
              {bench.map((p) => (
                <button key={p.id} onClick={() => onSelect(p.id)} className="shrink-0 text-left rounded-xl bg-black/40 border border-white/10 hover:border-neon/40 px-3 py-2 min-w-[130px]">
                  <div className="flex items-center gap-1.5"><PosTag pos={p.pos} /><span className="text-sm font-semibold text-white truncate">{p.short}</span></div>
                  <div className="font-mono text-[10px] text-slate-400 mt-0.5">{fmtM(p.price)} · {projection(p)} pts</div>
                </button>
              ))}
              {bench.length === 0 && <span className="text-xs text-slate-500">Sin suplentes.</span>}
            </div>
          </div>
          <p className="text-[11px] text-slate-500 mt-3 font-mono">💡 Toca un jugador para cambiarlo, venderlo o darle el brazalete (puntúa x2).</p>
        </section>
      );
    }

    /* =====================================================
       PANEL DE JUGADOR / FICHAJE
    ===================================================== */
    function PlayerSheet({ sheet, squad, market, budget, captainId, onClose, actions }) {
      if (!sheet) return null;
      if (sheet.mode === 'add') {
        const options = market.filter((m) => m.pos === sheet.pos).sort((a, b) => projection(b) - projection(a));
        return (
          <Sheet onClose={onClose}>
            <h3 className="font-display font-bold text-lg text-white">Fichar {POS_LABEL[sheet.pos].toLowerCase()}</h3>
            <p className="text-xs text-slate-400">Caja disponible: {fmtM(budget)}. El fichaje entra directo al once.</p>
            <div className="space-y-2 mt-4">
              {options.length === 0 && <p className="text-sm text-slate-500">No hay jugadores de esa posición en el mercado.</p>}
              {options.map((m) => (
                <OptionRow key={m.id} p={m} delta={projection(m)} disabled={m.price > budget || m.health !== 'ok'}
                  note={m.price > budget ? `Te faltan ${fmtM(m.price - budget)}` : m.health !== 'ok' ? HEALTH_INFO[m.health].label : null}
                  label="Fichar" onClick={() => actions.addPlayer(m.id, true)} />
              ))}
            </div>
          </Sheet>
        );
      }
      const player = squad.find((p) => p.id === sheet.id);
      if (!player) return null;
      const base = projection(player);
      const n = nextOf(player);
      const options = market.filter((m) => m.pos === player.pos)
        .map((m) => ({ m, delta: projection(m) - base, affordable: m.price <= budget + player.price }))
        .sort((a, b) => b.delta - a.delta);
      const swapOpts = squad.filter((b) => b.starter !== player.starter && b.pos === player.pos);
      const isCap = captainId === player.id;
      return (
        <Sheet onClose={onClose}>
          <div className="flex items-center gap-2 flex-wrap"><PosTag pos={player.pos} /><HealthDot health={player.health} /><span className={`text-xs ${HEALTH_INFO[player.health].cls}`}>{HEALTH_INFO[player.health].label}</span>{player.starter ? <span className="text-[10px] font-mono text-neon">TITULAR</span> : <span className="text-[10px] font-mono text-slate-400">SUPLENTE</span>}</div>
          <h3 className="font-display font-bold text-lg text-white mt-1 pr-8">{player.name}{isCap && <span className="text-hack"> ©</span>}</h3>
          <p className="text-xs text-slate-400">{teamOf(player.team).name} · {n.home ? 'vs' : '@'} {n.rival} (dif. {n.diff}/5) · {fmtM(player.price)}</p>
          <div className="mt-3 grid grid-cols-3 gap-2 text-center">
            <Kpi label="Proyección" value={`${base} pts`} />
            <Kpi label="Media" value={player.avg.toFixed(1)} />
            <Kpi label="Tendencia" value={`${player.trend > 0 ? '+' : ''}${player.trend}%`} tone={player.trend >= 0 ? 'text-neon' : 'text-danger'} />
          </div>
          <div className="mt-3 rounded-xl bg-black/40 border border-white/10 p-2">
            <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold px-1">Precio 7 días + previsión</div>
            <PriceChart p={player} w={320} h={110} big />
          </div>
          <div className="mt-3 grid grid-cols-2 gap-2">
            <button disabled={!player.starter || isCap} onClick={() => actions.setCaptain(player.id)} className="btn-hack rounded-xl py-2 text-xs">{isCap ? 'Ya es capitán ©' : 'Hacer capitán ©'}</button>
            <button onClick={() => actions.sellPlayer(player.id)} className="rounded-xl py-2 text-xs border border-danger/50 text-danger hover:bg-danger/10">Vender por {fmtM(player.price)}</button>
          </div>

          {swapOpts.length > 0 && (
            <>
              <h4 className="mt-5 mb-2 text-xs uppercase tracking-wider text-slate-500 font-semibold">{player.starter ? 'Desde tu banquillo (gratis)' : 'Meter en el once en lugar de'}</h4>
              <div className="space-y-2">
                {swapOpts.map((b) => {
                  const d = player.starter ? projection(b) - base : base - projection(b);
                  return <OptionRow key={b.id} p={b} delta={d} label={player.starter ? 'Alinear' : 'Cambiar'}
                    onClick={() => player.starter ? actions.benchSwap(player.id, b.id) : actions.benchSwap(b.id, player.id)} />;
                })}
              </div>
            </>
          )}

          <h4 className="mt-5 mb-2 text-xs uppercase tracking-wider text-slate-500 font-semibold">Reemplazos recomendados del mercado</h4>
          <div className="space-y-2">
            {options.length === 0 && <p className="text-sm text-slate-500">No hay {POS_LABEL[player.pos].toLowerCase()}s en el mercado.</p>}
            {options.map(({ m, delta, affordable }) => (
              <OptionRow key={m.id} p={m} delta={delta} disabled={!affordable || m.health !== 'ok'}
                note={!affordable ? `Te faltan ${fmtM(m.price - budget - player.price)}` : m.health !== 'ok' ? HEALTH_INFO[m.health].label : `Coste neto ${fmtM(m.price - player.price)}`}
                label="Fichar" onClick={() => actions.buyReplacement(player.id, m.id)} />
            ))}
          </div>
        </Sheet>
      );
    }
    function Sheet({ children, onClose }) {
      useEffect(() => {
        const k = (e) => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', k);
        return () => window.removeEventListener('keydown', k);
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sheet-backdrop" onClick={onClose}>
          <div className="card relative w-full sm:max-w-lg max-h-[88vh] overflow-auto rounded-b-none sm:rounded-b-[18px] p-4 sm:p-5 fade-in glow-purple" onClick={(e) => e.stopPropagation()}>
            <button onClick={onClose} className="absolute top-3 right-3 p-1.5 rounded-lg hover:bg-white/10 text-slate-400" aria-label="Cerrar"><Icon name="x" /></button>
            {children}
          </div>
        </div>
      );
    }
    function Kpi({ label, value, tone = 'text-white' }) {
      return (
        <div className="rounded-xl bg-black/40 border border-white/10 py-2 px-1">
          <div className="text-[10px] uppercase tracking-wider text-slate-500">{label}</div>
          <div className={`font-display font-bold text-sm ${tone}`}>{value}</div>
        </div>
      );
    }
    function OptionRow({ p, delta, disabled, note, label, onClick }) {
      return (
        <div className={`flex items-center gap-3 rounded-xl border p-2.5 ${delta > 0 ? 'border-neon/30 bg-neon/[.03]' : 'border-white/10 bg-black/30'}`}>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1.5">
              <HealthDot health={p.health} />
              <span className="font-semibold text-sm text-white truncate">{p.name}</span>
              {p.isNew && <span className="text-[9px] font-mono text-hack border border-hack/50 rounded px-1">OCR</span>}
            </div>
            <div className="font-mono text-[10px] text-slate-400 mt-0.5 flex flex-wrap gap-x-2">
              <span>{teamOf(p.team).name}</span><span>{fmtM(p.price)}</span><span>{projection(p)} pts</span>

          <span className={`font-mono text-xs font-semibold ${delta > 0 ? 'text-neon' : delta < 0 ? 'text-danger' : 'text-slate-400'}`}>{delta > 0 ? '+' : ''}{delta.toFixed(1)}</span>

    /* =====================================================
       CALCULADORA DE GUERRA DE CLÁUSULAS
    ===================================================== */
    function ClauseCalculator({ squad, rivals, setRivals, playerId, setPlayerId }) {
      const [targetId, setTargetId] = useState(rivals[0]?.id);
      const [aggr, setAggr] = useState(60);
      useEffect(() => { if (!squad.find((p) => p.id === playerId)) setPlayerId(squad[0]?.id); }, [squad, playerId]);
      const player = squad.find((p) => p.id === playerId) || squad[0];
      const target = rivals.find((r) => r.id === targetId) || rivals[0];

      const calc = useMemo(() => {
        if (!player || !target) return null;
        const hype = Math.max(0, player.trend) / 100 + Math.max(0, formAvg(player) - 5) * 0.02;
        const fairValue = player.price * (1 + hype);
        const inflated = player.price * (1.15 + (aggr / 100) * 0.85);
        const leftPct = 0.25 - (aggr / 100) * 0.22;
        const ruin = target.budget * (1 - leftPct);
        let price = Math.max(fairValue, inflated);
        if (ruin > price && ruin <= player.price * 3) price = ruin;
        const exact = Math.floor(price * 1000) / 1000 - 0.000001;
        return { fairValue, exact };
      }, [player, target, aggr]);

      const updateBudget = (id, v) => {
        const n = parseFloat(v);
        setRivals((rs) => rs.map((r) => (r.id === id ? { ...r, budget: isNaN(n) ? 0 : n } : r)));
      };
      if (!player) return null;

      return (
        <section id="clausulas" className="card p-4 sm:p-5">
          <SectionTitle icon="shield" tone="text-hack">GUERRA DE CLÁUSULAS</SectionTitle>
          <p className="text-xs text-slate-400 -mt-2">Calcula el precio de venta exacto en el mercado interno para que, si un rival te roba al jugador, se quede sin caja.</p>
          <div className="grid sm:grid-cols-2 gap-3 mt-4">
            <label className="block">
              <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Tu jugador</span>
              <select value={player.id} onChange={(e) => setPlayerId(e.target.value)} className="field mt-1">
                {squad.map((p) => <option key={p.id} value={p.id}>{p.name} · {fmtM(p.price)}</option>)}
              </select>
            </label>
            <label className="block">
              <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Rival a arruinar</span>
              <select value={target.id} onChange={(e) => setTargetId(e.target.value)} className="field mt-1">
                {rivals.map((r) => <option key={r.id} value={r.id}>{r.name} · {fmtM(r.budget)}</option>)}
              </select>
            </label>
          </div>
          <label className="block mt-4">
            <div className="flex justify-between text-[11px] uppercase tracking-wider font-semibold">
              <span className="text-slate-500">Agresividad</span>
              <span className={aggr >= 75 ? 'text-danger' : aggr >= 40 ? 'text-hack' : 'text-neon'}>{aggr}% · {aggr >= 75 ? 'Modo villano' : aggr >= 40 ? 'Presión alta' : 'Conservador'}</span>
            </div>
            <input type="range" min="0" max="100" value={aggr} onChange={(e) => setAggr(+e.target.value)} className="w-full mt-2" />
          </label>
          {calc && (
            <div className="mt-4 rounded-2xl bg-black/50 border border-hack/40 p-4 glow-purple">
              <div className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Precio exacto de venta</div>
              <div className="font-display font-black text-2xl sm:text-3xl text-hack glow-text-purple mt-1 break-words">{fmtEUR(calc.exact)}</div>
              <div className="font-mono text-[11px] text-slate-400 mt-1">{(calc.exact / player.price).toFixed(2)}x su valor ({fmtM(player.price)}) · valor justo con hype {fmtM(calc.fairValue)}</div>
              <p className="text-xs text-slate-300 mt-3 leading-relaxed">
                Si <b className="text-white">{target.name}</b> paga este precio, se queda con{' '}
                <b className={target.budget - calc.exact < 0 ? 'text-neon' : 'text-danger'}>{target.budget - calc.exact < 0 ? 'nada: no puede pagarlo' : fmtM(target.budget - calc.exact)}</b>{' '}
                en caja para el resto de la jornada. El precio termina en 999 € para esquivar las pujas redondas.
              </p>
            </div>
          )}
          <div className="mt-4">
            <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Impacto por rival (edita su caja)</div>
            <div className="space-y-2">
              {rivals.map((r) => {
                const left = r.budget - (calc ? calc.exact : 0);
                const can = left >= 0;
                const dmg = can ? Math.min(100, ((calc ? calc.exact : 0) / (r.budget || 1)) * 100) : 0;
                return (
                  <div key={r.id} className="rounded-xl bg-black/30 border border-white/10 p-2.5">
                    <div className="flex items-center gap-2">
                      <span className="flex-1 text-sm font-semibold text-white truncate">{r.name}</span>
                      <input type="number" step="0.1" value={r.budget} onChange={(e) => updateBudget(r.id, e.target.value)}
                        className="w-20 rounded-lg bg-black/60 border border-white/10 px-2 py-1 text-xs font-mono text-right text-white focus:outline-none focus:border-hack" />
                      <span className="text-[10px] text-slate-500">M€</span>
                    </div>
                    <div className="mt-2 flex items-center gap-2">
                      <div className="flex-1 h-1.5 rounded-full bg-white/5 overflow-hidden">
                        <div className="h-full rounded-full transition-all" style={{ width: `${dmg}%`, background: dmg >= 80 ? '#ff3b6b' : dmg >= 50 ? '#b026ff' : '#39ff88' }} />
                      </div>
                      <span className={`font-mono text-[10px] w-32 text-right ${can ? (dmg >= 80 ? 'text-danger' : 'text-hack') : 'text-neon'}`}>
                        {can ? `${dmg.toFixed(0)}% caja · queda ${fmtM(left)}` : 'No puede pagarlo 🔒'}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    /* =====================================================

        .sort((a, b) => b.trend - a.trend);
      const rising = all.filter((p) => p.trend >= 8 && p.health === 'ok').sort((a, b) => b.trend - a.trend).slice(0, 6);

        <div className="space-y-5">

            <p className="text-xs text-slate-400 -mt-2 leading-relaxed">
              {live

          {rising.length > 0 && (
            <section className="card-purple p-4 sm:p-5">
              <SectionTitle icon="bell" tone="text-hack">SUBIDAS INMINENTES</SectionTitle>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 -mt-1">
                {rising.map((p) => (
                  <div key={p.id} className="rounded-xl border border-neon/30 bg-black/40 p-3">
                    <div className="flex items-center gap-1.5"><PosTag pos={p.pos} /><span className="font-semibold text-white text-sm truncate">{p.name}</span>{mineIds.has(p.id) && <span className="text-[9px] font-mono text-neon border border-neon/50 rounded px-1">TUYO</span>}</div>
                    <p className="text-xs text-slate-300 mt-1.5">Subirá ~<b className="text-neon">{p.trend}%</b> (≈ +{fmtM(p.price * p.trend / 100)}) en el próximo cierre.</p>

              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar jugador o equipo…" className="field sm:max-w-xs" />
              <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                {[['all', 'Todos'], ['mine', 'Mi plantilla'], ['market', 'Mercado'], ['watch', '★ Vigilados']].map(([k, l]) => (
                  <button key={k} onClick={() => setFilter(k)} className={`shrink-0 text-xs px-3 py-1.5 rounded-lg border ${filter === k ? 'border-neon bg-neon/15 text-neon' : 'border-white/10 text-slate-400'}`}>{l}</button>
                ))}

                ))}

              {list.length === 0 && <p className="text-sm text-slate-500">Sin resultados.</p>}

                return (

                          <span className="font-semibold text-sm text-white truncate">{p.name}</span>

                        </div>
                        <div className="font-mono text-[10px] text-slate-500 mt-0.5">{teamOf(p.team).name} · {projection(p)} pts proy.</div>
                      </div>
                      <div className="hidden sm:block"><PriceChart p={p} /></div>
                      <div className="text-right">
                        <div className="font-display font-bold text-sm text-white">{fmtM(p.price)}</div>
                        <TrendTag trend={p.trend} />

                              {holes[p.pos] > 0 && <button disabled={p.price > budget || p.health !== 'ok'} onClick={() => actions.addPlayer(p.id, true)} className="btn-hack text-xs rounded-lg px-3 py-1.5">Fichar y alinear</button>}

                            </>

                    )}
                  </div>
                );
              })}
            </div>
          </section>

          <ImportPanel onImport={onImport} toast={toast} />
        </div>
      );
    }

    const SAMPLE_JSON = `{
  "budget": 18.5,
  "squad": [
    { "name": "Pedri González", "team": "BAR", "pos": "MED", "price": 18.4,
      "points": 70, "avg": 7.0, "form": [8,9,6,7,8], "health": "ok",
      "trend": 4, "starter": true }
  ],
  "market": [
    { "name": "Nico Williams", "team": "ATH", "pos": "DEL", "price": 18.2, "trend": 6 }
  ]
}`;
    function ImportPanel({ onImport, toast }) {
      const [url, setUrl] = useState(() => { try { return localStorage.getItem('fh-url') || ''; } catch (e) { return ''; } });
      const [text, setText] = useState('');
      const [busy, setBusy] = useState(false);
      const fileRef = useRef(null);
      const apply = (raw) => {
        try {
          const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
          onImport(data);
        } catch (e) { toast('JSON no válido: ' + e.message, 'error'); }
      };
      const fromUrl = async () => {
        if (!url) return;
        setBusy(true);
        try {
          try { localStorage.setItem('fh-url', url); } catch (e) { /* sin almacenamiento */ }
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          apply(await res.json());
        } catch (e) {
          toast('No se pudo leer la URL (' + e.message + '). Comprueba que permite CORS.', 'error');
        } finally { setBusy(false); }
      };
      return (
        <section className="card p-4 sm:p-5">
          <SectionTitle icon="download">DATOS EN DIRECTO / IMPORTAR</SectionTitle>
          <p className="text-xs text-slate-400 -mt-2 leading-relaxed">
            Conecta tu propia fuente de datos: una URL que devuelva JSON (tu API, un Google Sheet publicado como JSON, un script…) o pega/sube el JSON. Se sustituye tu plantilla y/o el mercado.
          </p>
          <div className="flex gap-2 mt-3">
            <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://mi-api.com/fantasy.json" className="field" />
            <button onClick={fromUrl} disabled={busy || !url} className="btn-neon rounded-xl px-4 text-xs shrink-0">{busy ? 'Leyendo…' : 'Cargar'}</button>
          </div>
          <textarea value={text} onChange={(e) => setText(e.target.value)} rows={4} placeholder="…o pega aquí el JSON" className="field mt-2 font-mono text-xs" />
          <div className="flex flex-wrap gap-2 mt-2">
            <button onClick={() => apply(text)} disabled={!text.trim()} className="btn-hack rounded-lg px-3 py-1.5 text-xs">Importar JSON pegado</button>
            <button onClick={() => fileRef.current?.click()} className="btn-ghost rounded-lg px-3 py-1.5 text-xs">Subir archivo .json</button>
            <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => {
              const f = e.target.files[0]; if (!f) return;
              f.text().then(apply); e.target.value = '';
            }} />
          </div>
          <details className="mt-3">
            <summary className="text-xs text-slate-400 cursor-pointer">Ver formato esperado</summary>
            <pre className="mt-2 text-[11px] font-mono text-neon/80 bg-black/50 rounded-xl p-3 overflow-x-auto">{SAMPLE_JSON}</pre>
            <p className="text-[11px] text-slate-500 mt-1">pos: POR, DEF, MED o DEL · health: ok, duda, lesionado o sancionado · team: código (BAR) o nombre (FC Barcelona). Los campos que falten se rellenan con valores por defecto.</p>
          </details>
        </section>
      );
    }

    /* =====================================================
       PESTAÑA LIGA: CLASIFICACIÓN, ESPÍA, PUJAS
    ===================================================== */
    function LeagueTab({ standings, rivals, squad, bids, onProtect }) {
      const [spyId, setSpyId] = useState(rivals[0]?.id);
      const spy = rivals.find((r) => r.id === spyId) || rivals[0];
      const spySquad = spy ? spy.squadIds.map((id) => DB[id]).filter(Boolean) : [];
      const spyProj = spySquad.reduce((s, p) => s + projection(p), 0) + Math.max(0, ...spySquad.map(projection));
      const weak = [...spySquad].sort((a, b) => projection(a) - projection(b))[0];
      const star = [...spySquad].sort((a, b) => projection(b) - projection(a))[0];
      const threats = spy ? squad.filter((p) => p.price <= spy.budget).sort((a, b) => b.price - a.price).slice(0, 5) : [];
      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start [&>*]:min-w-0">

            <SectionTitle icon="trophy" tone="text-warn">CLASIFICACIÓN</SectionTitle>

              {standings.map((s, i) => (
                <button key={s.id} onClick={() => s.id !== 'me' && setSpyId(s.id)}
                  className={`w-full grid grid-cols-[28px_1fr_auto] items-center gap-3 rounded-xl px-3 py-2.5 border text-left transition ${s.id === 'me' ? 'border-neon/50 bg-neon/[.06]' : s.id === spyId ? 'border-hack/60 bg-hack/10' : 'border-white/10 bg-black/30 hover:border-white/25'}`}>
                  <span className={`font-display font-black ${i === 0 ? 'text-warn' : 'text-slate-500'}`}>{i + 1}</span>
                  <div className="min-w-0">
                    <div className="font-semibold text-sm text-white truncate">{s.name}{s.id === 'me' && ' (tú)'}</div>
                    <div className="font-mono text-[10px] text-slate-500">Última: {s.last} pts · Caja {fmtM(s.budget)} · Plantilla {fmtM(s.value)}</div>
                  </div>
                  <span className="font-display font-bold text-white">{s.points}</span>
                </button>
              ))}
            </div>
            <p className="text-[11px] text-slate-500 mt-3 font-mono">💡 Toca un rival para espiar su plantilla.</p>
          </section>

          {spy && (
            <section className="card-purple p-4 sm:p-5">
              <SectionTitle icon="eye" tone="text-hack">ESPÍA: {spy.name.toUpperCase()}</SectionTitle>
              <div className="grid grid-cols-3 gap-2 text-center -mt-1">
                <Kpi label="Caja" value={fmtM(spy.budget)} tone="text-hack" />
                <Kpi label="Proyección" value={`${spyProj.toFixed(0)} pts`} />
                <Kpi label="Valor" value={fmtM(spySquad.reduce((s, p) => s + p.price, 0))} />
              </div>
              {star && weak && (
                <p className="text-sm text-slate-300 mt-3 leading-relaxed">
                  <span className="text-hack font-semibold">Informe: </span>
                  Su arma es <b className="text-white">{star.name}</b> ({projection(star)} pts proyectados, seguramente su capitán). Su punto débil es <b className="text-white">{weak.name}</b> ({projection(weak)} pts{weak.health !== 'ok' ? `, ${HEALTH_INFO[weak.health].label.toLowerCase()}` : ''}).
                  {spy.budget > 15 ? ` Tiene ${fmtM(spy.budget)} en caja: puede pujar fuerte esta jornada.` : ' Tiene poca caja: aprovecha para pujar por jugadores que quiera.'}
                </p>

                    <PosTag pos={p.pos} /><HealthDot health={p.health} />
                    <span className="text-sm text-white truncate flex-1">{p.short}</span>
                    <span className="font-mono text-[10px] text-slate-400">{projection(p)} pts</span>
                  </div>
                ))}
