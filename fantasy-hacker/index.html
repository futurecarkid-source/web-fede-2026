    :root {

      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::selection { background: var(--hack); color: #fff; }

    ::-webkit-scrollbar-thumb { background: #2a2f45; border-radius: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .glow-green { box-shadow: 0 0 0 1px rgba(57,255,136,.45), 0 0 18px rgba(57,255,136,.18); }
    .glow-purple { box-shadow: 0 0 0 1px rgba(176,38,255,.55), 0 0 26px rgba(176,38,255,.25); }

    .card {
      background: linear-gradient(180deg, rgba(17,20,32,.92), rgba(9,11,18,.92));
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      backdrop-filter: blur(6px);
    }
    .card-purple {
      background:
        linear-gradient(180deg, rgba(40, 10, 66, .55), rgba(12, 6, 22, .9));
      border: 1px solid rgba(176,38,255,.45);
      box-shadow: 0 0 30px rgba(176,38,255,.18), inset 0 0 40px rgba(176,38,255,.06);
      border-radius: 18px;
    }

    /* Logo glitch */
    .glitch { position: relative; }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none;
    }
    .glitch::before { color: var(--hack); transform: translate(2px, 0); clip-path: inset(0 0 55% 0); animation: glitchA 3.2s infinite steps(1); opacity: .8; }
    .glitch::after { color: var(--neon); transform: translate(-2px, 0); clip-path: inset(55% 0 0 0); animation: glitchB 2.7s infinite steps(1); opacity: .8; }
    @keyframes glitchA { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(3px,-1px); } 96% { transform: translate(-2px,1px); } }
    @keyframes glitchB { 0%, 88%, 100% { transform: translate(0,0); } 89% { transform: translate(-3px,1px); } 94% { transform: translate(2px,0); } }

    /* Pitch */
    .pitch {
      position: relative;
      background:
        repeating-linear-gradient(180deg, #0b3a22 0 10%, #0d4428 10% 20%);
      border-radius: 18px;
      border: 1px solid rgba(57,255,136,.35);
      box-shadow: inset 0 0 60px rgba(0,0,0,.65), 0 0 30px rgba(57,255,136,.08);
      overflow: hidden;
    }
    .pitch-svg line, .pitch-svg rect, .pitch-svg circle, .pitch-svg path { stroke: rgba(210,255,230,.35); stroke-width: .35; fill: none; }
    .pitch-svg .spot { fill: rgba(210,255,230,.45); stroke: none; }

    .player-chip { transition: transform .2s ease, filter .2s ease; }
    .player-chip:hover { transform: translateY(-3px) scale(1.04); filter: drop-shadow(0 0 10px rgba(57,255,136,.6)); }
    .player-chip.selected .shirt { box-shadow: 0 0 0 2px var(--hack), 0 0 22px var(--hack); }

    .shirt {
      width: 46px; height: 46px; border-radius: 14px;
      display: grid; place-items: center;
      font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 12px;
      color: #05060a;
      clip-path: polygon(22% 0, 38% 8%, 62% 8%, 78% 0, 100% 18%, 88% 38%, 82% 32%, 82% 100%, 18% 100%, 18% 32%, 12% 38%, 0 18%);
    }
    @media (min-width: 640px) { .shirt { width: 54px; height: 54px; font-size: 13px; } }

    /* Scanner */
    .scan-wrap { position: relative; overflow: hidden; }
    .scan-line {
      position: absolute; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      box-shadow: 0 0 18px var(--neon), 0 0 40px var(--neon);
      animation: scan 1.6s ease-in-out infinite;
    }
    .scan-grid {
      position: absolute; inset: 0;
      background:
        linear-gradient(rgba(57,255,136,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,136,.12) 1px, transparent 1px);
      background-size: 18px 18px;
      mix-blend-mode: screen;
    }
    @keyframes scan { 0% { top: 0%; } 50% { top: calc(100% - 3px); } 100% { top: 0%; } }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .fade-in { animation: fadeIn .45s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
    @keyframes pulseDot { 0%, 100% { box-shadow: 0 0 0 0 rgba(57,255,136,.7); } 50% { box-shadow: 0 0 0 7px rgba(57,255,136,0); } }

    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.15); color: #fff; } 100% { transform: scale(1); } }

    input[type=range] { accent-color: var(--hack); }
    .dropzone-active { border-color: var(--neon) !important; background: rgba(57,255,136,.06); }

      background: linear-gradient(90deg, #39ff88, #1fd6a0);
      color: #03140a; font-weight: 800;

    /* =====================================================
       MOTOR DE PROYECCIÓN
    ===================================================== */
    const DIFF_MULT = { 1: 1.3, 2: 1.15, 3: 1, 4: 0.85, 5: 0.7 };
    const HEALTH_MULT = { ok: 1, duda: 0.55, lesionado: 0, sancionado: 0 };
    const HEALTH_INFO = {
      ok: { label: 'Disponible', cls: 'text-neon', dot: 'bg-neon' },
      duda: { label: 'Duda', cls: 'text-warn', dot: 'bg-warn' },
      lesionado: { label: 'Lesionado', cls: 'text-danger', dot: 'bg-danger' },
      sancionado: { label: 'Sancionado', cls: 'text-danger', dot: 'bg-danger' },
    };

    const mean = (a) => a.reduce((s, x) => s + x, 0) / (a.length || 1);
    const formAvg = (p) => mean(p.form);
    const nextOf = (p) => (TEAMS[p.team] || { next: { rival: '—', diff: 3, home: true } }).next;

    function projection(p) {
      const n = nextOf(p);
      const base = 0.45 * p.avg + 0.55 * formAvg(p);
      const minutesFactor = p.last.minutes >= 70 ? 1.05 : p.last.minutes >= 46 ? 0.9 : p.last.minutes > 0 ? 0.8 : 0.85;
      const val = base * DIFF_MULT[n.diff] * HEALTH_MULT[p.health] * minutesFactor;
      return Math.round(val * 10) / 10;
    }

    const fmtM = (m) => `${m.toFixed(1)}M€`;
    const fmtEUR = (m) => new Intl.NumberFormat('es-ES', { maximumFractionDigits: 0 }).format(Math.round(m * 1e6)) + ' €';
    const sign = (n) => (n > 0 ? '+' : '') + n;

    /* =====================================================
       IA NARRATIVA: genera hacks y recomendaciones
    ===================================================== */
    function describeGood(p) {
      const r = [];
      const n = nextOf(p);
      if (p.last.goals > 0) r.push(`metió ${p.last.goals === 1 ? 'gol' : p.last.goals + ' goles'} el partido pasado`);
      if (p.last.assists > 0) r.push(`dio ${p.last.assists === 1 ? 'una asistencia' : p.last.assists + ' asistencias'}`);
      if (p.last.rating >= 7.5) r.push(`firmó un ${p.last.rating.toFixed(1)} de nota`);
      if (formAvg(p) >= 6.5) r.push(`lleva una racha oculta de ${formAvg(p).toFixed(1)} pts de media en las últimas 5`);
      if (n.diff <= 2) r.push(`su equipo (${TEAMS[p.team].name}) ${n.home ? 'recibe' : 'visita'} a ${n.rival}, un rival débil (dificultad ${n.diff}/5)`);
      if (p.trend > 0) r.push(`su precio va a subir un ${p.trend}% esta semana`);
      return r;
    }

    function describeBad(p) {
      const r = [];
      const n = nextOf(p);
      if (p.health === 'lesionado') r.push('está lesionado y no sumará nada esta jornada');
      if (p.health === 'sancionado') r.push('está sancionado: 0 puntos asegurados');
      if (p.health === 'duda') r.push('es duda médica para el próximo partido');
      if (p.last.subbedAt && p.last.subbedAt <= 65) r.push(`viene de ser sustituido al minuto ${p.last.subbedAt} con un pobre ${p.last.rating.toFixed(1)} de nota`);
      if (formAvg(p) < 3) r.push(`promedia solo ${formAvg(p).toFixed(1)} pts en las últimas 5 jornadas`);
      if (n.diff >= 4) r.push(`le toca contra ${n.rival}, de los rivales más duros (dificultad ${n.diff}/5)`);
      if (p.trend < 0) r.push(`su precio caerá un ${Math.abs(p.trend)}% si no lo vendes ya`);
      return r;
    }

    const joinEs = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1];

    function generateHacks(squad, market, budget) {
      const hacks = [];
      const starters = squad.filter((p) => p.starter);
      const used = new Set();

      const ranked = [...starters].sort((a, b) => projection(a) - projection(b));
      ranked.forEach((s) => {
        const candidates = market
          .filter((m) => m.pos === s.pos && m.health === 'ok' && !used.has(m.id) && m.price <= budget + s.price)
          .map((m) => ({ m, gain: projection(m) - projection(s) }))
          .filter((c) => c.gain >= 1.2)
          .sort((a, b) => b.gain - a.gain + (b.m.trend - a.m.trend) * 0.05);
        if (!candidates.length) return;
        const { m, gain } = candidates[0];
        used.add(m.id);
        const good = describeGood(m);
        const bad = describeBad(s);
        const cost = m.price - s.price;
        const severity = s.health === 'lesionado' || s.health === 'sancionado' ? 'critical' : gain >= 3 ? 'high' : 'mid';
        hacks.push({
          id: `hack-${s.id}-${m.id}`,
          type: 'swap',
          severity,
          outId: s.id,
          inId: m.id,
          title: `Cambia a ${s.name} por ${m.name}`,
          why: `El jugador del mercado ${joinEs(good) || 'tiene mejor proyección'}. En cambio, tu titular ${joinEs(bad) || 'rinde por debajo de su alternativa'}.`,
          impact: `+${gain.toFixed(1)} pts proyectados · ${cost >= 0 ? 'Coste neto ' + fmtM(cost) : 'Liberas ' + fmtM(-cost)}`,
          gain,
        });
      });

      // Alertas sin reemplazo asequible
      starters.forEach((s) => {
        if ((s.health === 'lesionado' || s.health === 'sancionado') && !hacks.find((h) => h.outId === s.id)) {
          const bench = squad.find((b) => !b.starter && b.pos === s.pos && b.health === 'ok');
          hacks.push({
            id: `alert-${s.id}`,
            type: bench ? 'bench' : 'alert',
            severity: 'critical',
            outId: s.id,
            inId: bench ? bench.id : null,
            title: `${s.name} ${s.health === 'lesionado' ? 'LESIONADO' : 'SANCIONADO'} en tu once`,
            why: bench
              ? `No hay fichaje rentable en tu presupuesto, pero ${bench.name} está en tu banquillo y suma ${projection(bench).toFixed(1)} pts proyectados frente a 0.`
              : `Ahora mismo te da 0 puntos y no hay sustituto en caja. Vende para liberar ${fmtM(s.price)} antes de que su precio caiga un ${Math.abs(s.trend)}%.`,
            impact: bench ? `+${projection(bench).toFixed(1)} pts al instante` : 'Riesgo de 0 puntos',
            gain: bench ? projection(bench) : 0,
          });
        }
      });

      // Mantener a joyas en subida
      squad.filter((p) => p.trend >= 4 && p.health === 'ok').slice(0, 2).forEach((p) => {
        hacks.push({
          id: `hold-${p.id}`,
          type: 'hold',
          severity: 'info',
          outId: p.id,
          title: `Blinda a ${p.name}`,
          why: `${joinEs(describeGood(p)) || 'Está en forma'}. Venderlo ahora sería regalar su revalorización a la liga. Ponle precio de guerra en la calculadora de cláusulas.`,
          impact: `Revalorización estimada ${fmtM(p.price * p.trend / 100)}`,
          gain: 0,
        });
      });

      const order = { critical: 0, high: 1, mid: 2, info: 3 };
      return hacks.sort((a, b) => order[a.severity] - order[b.severity] || b.gain - a.gain);
    }

    function generateCards(squad, market) {
      const buy = market
        .filter((m) => m.health === 'ok' && (m.trend >= 6 || formAvg(m) >= 6.5))
        .sort((a, b) => b.trend + formAvg(b) - (a.trend + formAvg(a)))
        .slice(0, 6)
        .map((p) => ({ p, reason: p.trend >= 9 ? `Aceleración de mercado +${p.trend}%` : `Racha oculta: ${formAvg(p).toFixed(1)} pts/partido` }));
      const sell = squad
        .filter((p) => p.trend <= -3 || p.health === 'lesionado' || p.health === 'sancionado' || formAvg(p) < 2.5)
        .sort((a, b) => a.trend - b.trend)
        .map((p) => ({ p, reason: p.health === 'lesionado' ? 'Lesión: valor en caída libre' : p.health === 'sancionado' ? 'Sancionado esta jornada' : `Precio cayendo ${p.trend}%` }));
      const sellIds = new Set(sell.map((s) => s.p.id));
      const hold = squad
        .filter((p) => !sellIds.has(p.id))
        .sort((a, b) => projection(b) - projection(a))
        .slice(0, 6)
        .map((p) => ({ p, reason: p.trend > 0 ? `Revalorizando +${p.trend}%` : `Proyección sólida: ${projection(p)} pts` }));
      return { buy, sell, hold };
    }

    function UploadZone({ onAnalyzed }) {
      const [mode, setMode] = useState('team');
      const [preview, setPreview] = useState({ team: null, market: null });
      const [drag, setDrag] = useState(false);
      const [scanning, setScanning] = useState(false);
      const [log, setLog] = useState([]);
      const [progress, setProgress] = useState(0);
      const inputRef = useRef(null);
      const timers = useRef([]);

      useEffect(() => () => timers.current.forEach(clearTimeout), []);

      const readFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => setPreview((p) => ({ ...p, [mode]: e.target.result }));
        reader.readAsDataURL(file);
      };

      const analyze = () => {
        const script = OCR_SCRIPTS[mode];
        setScanning(true);
        setLog([]);
        setProgress(0);
        script.forEach((line, i) => {
          timers.current.push(setTimeout(() => {
            setLog((l) => [...l, line]);
            setProgress(Math.round(((i + 1) / script.length) * 100));
          }, 380 * (i + 1)));
        });
        timers.current.push(setTimeout(() => {
          setScanning(false);
          onAnalyzed(mode);
        }, 380 * (script.length + 1) + 200));
      };

      const current = preview[mode];

      return (
        <section className="card p-4 sm:p-5 glow-green relative overflow-hidden">

                  className={`px-3 py-2 rounded-lg transition ${mode === k ? 'bg-neon text-void shadow-[0_0_14px_rgba(57,255,136,.5)]' : 'text-slate-400 hover:text-white'}`}>

              onDrop={(e) => { e.preventDefault(); setDrag(false); readFile(e.dataTransfer.files[0]); }}

              className={`scan-wrap cursor-pointer rounded-2xl border-2 border-dashed border-white/15 hover:border-neon/60 transition min-h-[180px] grid place-items-center text-center bg-black/30 ${drag ? 'dropzone-active' : ''}`}
            >
              <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={(e) => readFile(e.target.files[0])} />
              {current ? (
                <img src={current} alt="Captura subida" className="absolute inset-0 w-full h-full object-cover opacity-70" />
              ) : (
                <div className="px-4 py-6">
                  <div className="mx-auto w-14 h-14 rounded-2xl grid place-items-center bg-neon/10 text-neon mb-3 glow-green">
                    <Icon name={mode === 'team' ? 'upload' : 'image'} className="w-7 h-7" />
                  </div>
                  <p className="font-semibold text-white">{mode === 'team' ? 'Subir Imagen de Equipo' : 'Subir Imagen de Mercado'}</p>
                  <p className="text-xs text-slate-400 mt-1">Arrastra una captura o toca para elegir (PNG/JPG)</p>
                  <p className="text-[11px] text-slate-500 mt-2 font-mono">Sin imagen → la IA usa una captura de demo</p>
                </div>
              )}
              {scanning && (<><div className="scan-grid" /><div className="scan-line" /></>)}
              {current && !scanning && (
                <span className="absolute bottom-2 left-2 text-[11px] font-mono bg-black/70 px-2 py-1 rounded text-neon">Imagen lista ✔ · toca para cambiar</span>
              )}
            </div>

            <div className="flex flex-col gap-3">
              <div className="flex-1 rounded-2xl bg-black/60 border border-neon/20 p-3 font-mono text-[11px] sm:text-xs text-neon/90 min-h-[140px] max-h-[200px] overflow-auto">
                {log.length === 0 && !scanning && (
                  <p className="text-slate-500">$ hacker-vision --mode={mode} <span className="blink">▌</span></p>
                )}
                {log.map((l, i) => <p key={i} className="fade-in leading-relaxed">{l}</p>)}
                {scanning && <p className="blink">▌</p>}
              </div>
              <div className="h-1.5 rounded-full bg-white/5 overflow-hidden">

    /* ---------- CAMPO DE FÚTBOL ---------- */
    function Pitch({ squad, selectedId, onSelect, projTotal }) {

              <circle className="spot" cx="34" cy="52.5" r="0.6" />
              <rect x="13.85" y="2" width="40.3" height="16.5" />
              <rect x="24.85" y="2" width="18.3" height="5.5" />
              <circle className="spot" cx="34" cy="13" r="0.5" />
              <path d="M26.7 18.5 A9.15 9.15 0 0 0 41.3 18.5" />
              <rect x="13.85" y="86.5" width="40.3" height="16.5" />
              <rect x="24.85" y="97.5" width="18.3" height="5.5" />

    /* ---------- PANEL DE REEMPLAZO ---------- */
    function ReplaceSheet({ player, squad, market, budget, onClose, onBuy, onBenchSwap }) {
      if (!player) return null;
      const base = projection(player);
      const n = nextOf(player);
      const options = market
        .filter((m) => m.pos === player.pos)
        .map((m) => ({ m, delta: projection(m) - base, affordable: m.price <= budget + player.price }))
        .sort((a, b) => b.delta - a.delta);
      const benchOpts = squad.filter((b) => !b.starter && b.pos === player.pos);

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sheet-backdrop" onClick={onClose}>
          <div className="card w-full sm:max-w-lg max-h-[88vh] overflow-auto rounded-b-none sm:rounded-b-[18px] p-4 sm:p-5 fade-in glow-purple" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-3">
              <div>
                <div className="flex items-center gap-2"><PosTag pos={player.pos} /><HealthDot health={player.health} /><span className={`text-xs ${HEALTH_INFO[player.health].cls}`}>{HEALTH_INFO[player.health].label}</span></div>
                <h3 className="font-display font-bold text-lg text-white mt-1">{player.name}</h3>
                <p className="text-xs text-slate-400">{TEAMS[player.team].name} · {n.home ? 'vs' : '@'} {n.rival} (dif. {n.diff}/5) · {fmtM(player.price)}</p>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400"><Icon name="x" /></button>
            </div>
            <div className="mt-3 grid grid-cols-3 gap-2 text-center">
              <Kpi label="Proyección" value={`${base} pts`} />
              <Kpi label="Media" value={player.avg.toFixed(1)} />
              <Kpi label="Tendencia" value={`${sign(player.trend)}%`} tone={player.trend >= 0 ? 'text-neon' : 'text-danger'} />
            </div>

            {benchOpts.length > 0 && (
              <>
                <h4 className="mt-5 mb-2 text-xs uppercase tracking-wider text-slate-500 font-semibold">Desde tu banquillo (gratis)</h4>
                {benchOpts.map((b) => {
                  const d = projection(b) - base;
                  return (
                    <OptionRow key={b.id} p={b} delta={d} label="Alinear" onClick={() => onBenchSwap(player.id, b.id)} />
                  );
                })}
              </>
            )}

            <h4 className="mt-5 mb-2 text-xs uppercase tracking-wider text-slate-500 font-semibold">Reemplazos recomendados del mercado</h4>
            <div className="space-y-2">
              {options.length === 0 && <p className="text-sm text-slate-500">No hay {POS_LABEL[player.pos].toLowerCase()}s en el mercado.</p>}
              {options.map(({ m, delta, affordable }) => (
                <OptionRow key={m.id} p={m} delta={delta} disabled={!affordable || m.health !== 'ok'}
                  note={!affordable ? `Te faltan ${fmtM(m.price - budget - player.price)}` : m.health !== 'ok' ? HEALTH_INFO[m.health].label : `Coste neto ${fmtM(m.price - player.price)}`}
                  label="Fichar" onClick={() => onBuy(player.id, m.id)} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    function Kpi({ label, value, tone = 'text-white' }) {
      return (
        <div className="rounded-xl bg-black/40 border border-white/10 py-2">
          <div className="text-[10px] uppercase tracking-wider text-slate-500">{label}</div>
          <div className={`font-display font-bold text-sm ${tone}`}>{value}</div>
        </div>
      );
    }

    function OptionRow({ p, delta, disabled, note, label, onClick }) {
      return (
        <div className={`flex items-center gap-3 rounded-xl border p-2.5 ${delta > 0 ? 'border-neon/30 bg-neon/[.03]' : 'border-white/10 bg-black/30'}`}>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1.5">
              <HealthDot health={p.health} />
              <span className="font-semibold text-sm text-white truncate">{p.name}</span>
              {p.isNew && <span className="text-[9px] font-mono text-hack border border-hack/50 rounded px-1">OCR</span>}
            </div>
            <div className="font-mono text-[10px] text-slate-400 mt-0.5 flex flex-wrap gap-x-2">
              <span>{TEAMS[p.team].name}</span><span>{fmtM(p.price)}</span><span>{projection(p)} pts</span>
              {note && <span className="text-slate-500">· {note}</span>}
            </div>
          </div>
          <span className={`font-mono text-xs font-semibold ${delta > 0 ? 'text-neon' : delta < 0 ? 'text-danger' : 'text-slate-400'}`}>{delta > 0 ? '+' : ''}{delta.toFixed(1)}</span>
          <button disabled={disabled} onClick={onClick} className="btn-neon rounded-lg px-3 py-1.5 text-xs">{label}</button>

    /* ---------- CALCULADORA DE GUERRA DE CLÁUSULAS ---------- */
    function ClauseCalculator({ squad, rivals, setRivals }) {
      const [playerId, setPlayerId] = useState(squad[0]?.id);
      const [targetId, setTargetId] = useState(rivals[0]?.id);
      const [aggr, setAggr] = useState(60);

      useEffect(() => {
        if (!squad.find((p) => p.id === playerId)) setPlayerId(squad[0]?.id);
      }, [squad, playerId]);

      const player = squad.find((p) => p.id === playerId) || squad[0];
      const target = rivals.find((r) => r.id === targetId) || rivals[0];

      const calc = useMemo(() => {
        if (!player || !target) return null;
        const hype = Math.max(0, player.trend) / 100 + Math.max(0, formAvg(player) - 5) * 0.02;
        const fairValue = player.price * (1 + hype);
        const multiplier = 1.15 + (aggr / 100) * 0.85; // 1.15x → 2.0x
        const inflated = player.price * multiplier;
        // Precio "ruina": dejar al rival objetivo con solo un % mínimo de su caja
        const leftPct = 0.25 - (aggr / 100) * 0.22; // 25% → 3%
        const ruin = target.budget * (1 - leftPct);
        let price = Math.max(fairValue, inflated);
        if (ruin > price && ruin <= player.price * 3) price = ruin;
        // Precio "psicológico" exacto en euros, terminado en ...999 €
        const exact = Math.floor(price * 1000) / 1000 - 0.000001;
        const max = Math.max(...rivals.map((r) => r.budget));
        return { fairValue, inflated, ruin, exact, leftPct, max };
      }, [player, target, aggr, rivals]);

      const updateBudget = (id, v) => {
        const n = parseFloat(v);
        setRivals((rs) => rs.map((r) => (r.id === id ? { ...r, budget: isNaN(n) ? 0 : n } : r)));
      };

      return (
        <section className="card p-4 sm:p-5 border-hack/30">
          <h2 className="font-display font-bold text-base sm:text-lg tracking-wide text-white flex items-center gap-2">
            <Icon name="shield" className="w-5 h-5 text-hack" /> GUERRA DE CLÁUSULAS
          </h2>
          <p className="text-xs text-slate-400 mt-1">Calcula el precio de venta exacto en el mercado interno para que, si un rival te roba al jugador, se quede sin caja.</p>

          <div className="grid sm:grid-cols-2 gap-3 mt-4">
            <label className="block">
              <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Tu jugador</span>
              <select value={playerId} onChange={(e) => setPlayerId(e.target.value)} className="mt-1 w-full rounded-xl bg-black/50 border border-white/10 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-hack">
                {squad.map((p) => <option key={p.id} value={p.id}>{p.name} · {fmtM(p.price)}</option>)}
              </select>
            </label>
            <label className="block">
              <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Rival a arruinar</span>
              <select value={targetId} onChange={(e) => setTargetId(e.target.value)} className="mt-1 w-full rounded-xl bg-black/50 border border-white/10 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-hack">
                {rivals.map((r) => <option key={r.id} value={r.id}>{r.name} · {fmtM(r.budget)}</option>)}
              </select>
            </label>
          </div>

          <label className="block mt-4">
            <div className="flex justify-between text-[11px] uppercase tracking-wider font-semibold">
              <span className="text-slate-500">Agresividad</span>
              <span className={aggr >= 75 ? 'text-danger' : aggr >= 40 ? 'text-hack' : 'text-neon'}>{aggr}% · {aggr >= 75 ? 'Modo villano' : aggr >= 40 ? 'Presión alta' : 'Conservador'}</span>
            </div>
            <input type="range" min="0" max="100" value={aggr} onChange={(e) => setAggr(+e.target.value)} className="w-full mt-2" />
          </label>

          {calc && (
            <div className="mt-4 rounded-2xl bg-black/50 border border-hack/40 p-4 glow-purple">
              <div className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Precio exacto de venta</div>
              <div className="font-display font-black text-2xl sm:text-3xl text-hack glow-text-purple mt-1 break-words">{fmtEUR(calc.exact)}</div>
              <div className="font-mono text-[11px] text-slate-400 mt-1">
                {(calc.exact / player.price).toFixed(2)}x su valor ({fmtM(player.price)}) · valor justo con hype {fmtM(calc.fairValue)}
              </div>
              <p className="text-xs text-slate-300 mt-3 leading-relaxed">
                Si <b className="text-white">{target.name}</b> paga este precio, se queda con{' '}
                <b className={target.budget - calc.exact < 0 ? 'text-neon' : 'text-danger'}>{target.budget - calc.exact < 0 ? 'nada: no puede pagarlo' : fmtM(target.budget - calc.exact)}</b>{' '}
                en caja para el resto de la jornada. El precio termina en 999 € para esquivar las pujas redondas.
              </p>
            </div>
          )}

          <div className="mt-4">
            <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Impacto por rival (edita su caja)</div>
            <div className="space-y-2">
              {rivals.map((r) => {
                const left = r.budget - (calc ? calc.exact : 0);
                const can = left >= 0;
                const dmg = can ? Math.min(100, ((calc ? calc.exact : 0) / (r.budget || 1)) * 100) : 0;
                return (
                  <div key={r.id} className="rounded-xl bg-black/30 border border-white/10 p-2.5">
                    <div className="flex items-center gap-2">
                      <span className="flex-1 text-sm font-semibold text-white truncate">{r.name}</span>
                      <input type="number" step="0.1" value={r.budget} onChange={(e) => updateBudget(r.id, e.target.value)}
                        className="w-20 rounded-lg bg-black/60 border border-white/10 px-2 py-1 text-xs font-mono text-right text-white focus:outline-none focus:border-hack" />
                      <span className="text-[10px] text-slate-500">M€</span>
                    </div>
                    <div className="mt-2 flex items-center gap-2">
                      <div className="flex-1 h-1.5 rounded-full bg-white/5 overflow-hidden">
                        <div className="h-full rounded-full transition-all" style={{ width: `${dmg}%`, background: dmg >= 80 ? '#ff3b6b' : dmg >= 50 ? '#b026ff' : '#39ff88' }} />
                      </div>
                      <span className={`font-mono text-[10px] w-32 text-right ${can ? (dmg >= 80 ? 'text-danger' : 'text-hack') : 'text-neon'}`}>
                        {can ? `${dmg.toFixed(0)}% caja · queda ${fmtM(left)}` : 'No puede pagarlo 🔒'}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    /* ---------- TOASTS ---------- */
    function Toasts({ toasts }) {
      return (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 w-[calc(100%-32px)] max-w-sm pointer-events-none">
          {toasts.map((t) => (
            <div key={t.id} className={`fade-in rounded-xl px-4 py-3 text-sm font-semibold border backdrop-blur-md ${t.tone === 'error' ? 'bg-danger/15 border-danger/50 text-danger' : 'bg-black/80 border-neon/50 text-neon glow-green'}`}>
              {t.msg}
            </div>
          ))}
        </div>
      );
    }

    /* =====================================================
       APP
    ===================================================== */
    function App() {
      const saved = useMemo(loadState, []);
      const [squad, setSquad] = useState(saved?.squad || INITIAL_SQUAD);
      const [market, setMarket] = useState(saved?.market || INITIAL_MARKET);
      const [budget, setBudget] = useState(saved?.budget ?? INITIAL_BUDGET);
      const [rivals, setRivals] = useState(saved?.rivals || INITIAL_RIVALS);
      const [selectedId, setSelectedId] = useState(null);
      const [toasts, setToasts] = useState([]);

      useEffect(() => { saveState({ squad, market, budget, rivals }); }, [squad, market, budget, rivals]);

      const toast = useCallback((msg, tone = 'ok') => {
        const id = Math.random().toString(36).slice(2);
        setToasts((t) => [...t, { id, msg, tone }]);
        setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
      }, []);

      const squadValue = useMemo(() => squad.reduce((s, p) => s + p.price, 0), [squad]);
      const projTotal = useMemo(() => squad.filter((p) => p.starter).reduce((s, p) => s + projection(p), 0), [squad]);
      const hacks = useMemo(() => generateHacks(squad, market, budget), [squad, market, budget]);
      const cards = useMemo(() => generateCards(squad, market), [squad, market]);
      const squadMap = useMemo(() => Object.fromEntries(squad.map((p) => [p.id, p])), [squad]);
      const marketMap = useMemo(() => Object.fromEntries(market.map((p) => [p.id, p])), [market]);

      // Vende al titular y ficha al jugador del mercado en su lugar
      const buyReplacement = (outId, inId) => {
        const out = squad.find((p) => p.id === outId);
        const inn = market.find((p) => p.id === inId);
        if (!out || !inn) return;
        if (inn.price > budget + out.price) { toast('Presupuesto insuficiente para este hack', 'error'); return; }
        const before = projection(out);
        setSquad((sq) => sq.map((p) => (p.id === outId ? { ...inn, starter: out.starter, isNew: false } : p)));
        setMarket((mk) => [...mk.filter((p) => p.id !== inId), { ...out, starter: undefined }]);
        setBudget((b) => Math.round((b + out.price - inn.price) * 10) / 10);
        setSelectedId(null);
        const d = projection(inn) - before;
        toast(`⚡ ${inn.short} entra por ${out.short} · ${d >= 0 ? '+' : ''}${d.toFixed(1)} pts`);
      };

      const benchSwap = (outId, inId) => {
        setSquad((sq) => sq.map((p) => (p.id === outId ? { ...p, starter: false } : p.id === inId ? { ...p, starter: true } : p)));
        setSelectedId(null);
        const a = squad.find((p) => p.id === inId);
        toast(`🔁 ${a ? a.short : 'Suplente'} pasa al once titular`);
      };

      const executeHack = (h) => {
        if (h.type === 'swap') buyReplacement(h.outId, h.inId);
        else if (h.type === 'bench') benchSwap(h.outId, h.inId);
      };

      const onAnalyzed = (mode) => {
        if (mode === 'team') {
          setSquad(OCR_SQUAD);
          setBudget(OCR_BUDGET);
          toast('✔ Equipo leído: 14 jugadores importados al campo');
        } else {
          setMarket((mk) => {
            const ids = new Set(mk.map((p) => p.id));
            const squadIds = new Set(squad.map((p) => p.id));
            return [...OCR_MARKET.filter((p) => !ids.has(p.id) && !squadIds.has(p.id)), ...mk];
          });
          toast('✔ Mercado leído: 5 oportunidades nuevas detectadas');
        }
      };

      const reset = () => {
        setSquad(INITIAL_SQUAD); setMarket(INITIAL_MARKET); setBudget(INITIAL_BUDGET); setRivals(INITIAL_RIVALS); setSelectedId(null);
        toast('Datos de prueba restaurados');
      };

      const selected = squad.find((p) => p.id === selectedId) || null;

      return (
        <>
          <Navbar squadValue={squadValue} budget={budget} projTotal={projTotal} onReset={reset} />
          <main className="max-w-7xl mx-auto px-4 py-5 space-y-5">
            <UploadZone onAnalyzed={onAnalyzed} />

            <div className="grid lg:grid-cols-[1.05fr_1fr] gap-5 items-start">
              <div className="space-y-5 order-2 lg:order-1">
                <Pitch squad={squad} selectedId={selectedId} onSelect={setSelectedId} projTotal={projTotal} />
                <ClauseCalculator squad={squad} rivals={rivals} setRivals={setRivals} />
              </div>
              <div className="space-y-5 order-1 lg:order-2">
                <HackerFeed hacks={hacks} onExecute={executeHack} squadMap={squadMap} marketMap={marketMap} />
              </div>
            </div>

            <RecommendationCards cards={cards} />

            <footer className="text-center text-[11px] text-slate-600 font-mono py-6">
              FANTASY HACKER · Datos de prueba con fines de demostración · Proyecciones generadas por el motor local de IA
            </footer>
          </main>

          <ReplaceSheet player={selected} squad={squad} market={market} budget={budget}
            onClose={() => setSelectedId(null)} onBuy={buyReplacement} onBenchSwap={benchSwap} />
          <Toasts toasts={toasts} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
