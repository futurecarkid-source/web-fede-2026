              {threats.length === 0 && <p className="text-xs text-slate-500">Ninguno: no tiene caja suficiente.</p>}
              <div className="space-y-1.5">
                {threats.map((p) => (
                  <div key={p.id} className="flex items-center gap-2 rounded-lg bg-black/40 border border-danger/30 px-2.5 py-1.5">
                    <span className="text-sm text-white truncate flex-1">{p.name} <span className="font-mono text-[10px] text-slate-500">{fmtM(p.price)}</span></span>
                    <button onClick={() => onProtect(p.id)} className="btn-hack text-[11px] rounded-lg px-2.5 py-1">Blindar</button>
                  </div>
                ))}
              </div>
            </section>
          )}

          <section className="card p-4 sm:p-5 lg:col-span-2">
            <SectionTitle icon="swap">HISTORIAL DE PUJAS Y FICHAJES</SectionTitle>
            <div className="space-y-1.5 max-h-[360px] overflow-auto">
              {bids.map((b) => (
                <div key={b.id} className="grid grid-cols-[40px_1fr_auto] items-center gap-3 rounded-xl bg-black/30 border border-white/5 px-3 py-2">
                  <span className="font-mono text-[11px] text-slate-500">J{b.j}</span>
                  <div className="min-w-0 text-sm">
                    <b className={b.who === 'Tú' ? 'text-neon' : 'text-white'}>{b.who}</b>{' '}
                    <span className="text-slate-400">{b.type === 'compra' ? 'fichó a' : b.type === 'venta' ? 'vendió a' : 'pujó por'}</span>{' '}
                    <span className="text-white">{b.player}</span>
                  </div>
                  <span className={`font-mono text-xs ${b.type === 'venta' ? 'text-neon' : 'text-hack'}`}>{fmtM(b.amount)}</span>
                </div>
              ))}
            </div>
          </section>
        </div>
      );
    }

    /* =====================================================
       PESTAÑA JORNADA: SIMULADOR + HISTORIAL
    ===================================================== */
    function MatchdayTab({ jornada, projTotal, result, onSimulate, onApply, history }) {
      const maxH = Math.max(80, ...history.map((h) => h.total));
      return (
        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)] gap-5 items-start">
          <section className="card p-4 sm:p-5">
            <SectionTitle icon="play">SIMULADOR · JORNADA {jornada}</SectionTitle>
            <p className="text-xs text-slate-400 -mt-2">Juega la jornada con tu once actual. Cada jugador puntúa según su proyección más el azar del fútbol; el capitán suma doble. Tu proyección: <b className="text-neon">{projTotal.toFixed(1)} pts</b>.</p>
            <div className="flex flex-wrap gap-2 mt-4">
              <button onClick={onSimulate} className="btn-neon rounded-xl px-4 py-2.5 text-sm flex items-center gap-2"><Icon name="play" className="w-4 h-4" /> {result ? 'Volver a simular' : 'Simular jornada'}</button>
              {result && <button onClick={onApply} className="btn-hack rounded-xl px-4 py-2.5 text-sm">Cerrar jornada y actualizar liga →</button>}
            </div>
            {result && (
              <div className="mt-5 fade-in">
                <div className="rounded-2xl border border-neon/40 bg-neon/[.05] p-4 text-center">
                  <div className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Tus puntos</div>
                  <div className="font-display font-black text-4xl text-neon glow-text-green">{result.mine}</div>
                  <div className={`text-xs mt-1 ${result.mine >= projTotal ? 'text-neon' : 'text-danger'}`}>{result.mine >= projTotal ? '▲' : '▼'} {Math.abs(result.mine - projTotal).toFixed(1)} vs proyección</div>
                </div>
                <div className="space-y-1.5 mt-3">
                  {result.rows.map((r) => (
                    <div key={r.p.id} className="flex items-center gap-2 rounded-lg bg-black/40 border border-white/5 px-2.5 py-1.5">
                      <PosTag pos={r.p.pos} />
                      <span className="text-sm text-white truncate">{r.p.short}{r.captain && <span className="text-hack"> ©</span>}</span>
                      <span className="text-[11px] text-slate-400 truncate flex-1">{r.events.join(' ')}</span>
                      <span className={`font-display font-bold text-sm ${r.total >= 8 ? 'text-neon' : r.total <= 1 ? 'text-danger' : 'text-white'}`}>{r.total}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </section>
          <div className="space-y-5">
            {result && (
              <section className="card-purple p-4 sm:p-5 fade-in">
                <SectionTitle icon="trophy" tone="text-warn">RESULTADOS DE LA LIGA</SectionTitle>
                <div className="space-y-1.5">
                  {[{ id: 'me', name: 'Tú', pts: result.mine }, ...result.rivalRows].sort((a, b) => b.pts - a.pts).map((r, i) => (
                    <div key={r.id} className={`flex items-center gap-3 rounded-lg px-3 py-2 border ${r.id === 'me' ? 'border-neon/50 bg-neon/[.06]' : 'border-white/10 bg-black/30'}`}>
                      <span className="font-display font-black text-slate-500 w-5">{i + 1}</span>
                      <span className="flex-1 text-sm text-white truncate">{r.name}</span>
                      <span className="font-display font-bold text-white">{r.pts}</span>
                    </div>
                  ))}
                </div>
              </section>
            )}
            <section className="card p-4 sm:p-5">
              <SectionTitle icon="chart">TUS JORNADAS</SectionTitle>
              {history.length === 0 ? (
                <p className="text-xs text-slate-500">Cuando cierres una jornada aparecerá aquí tu evolución.</p>
              ) : (
                <div className="flex items-end gap-2 h-40 pt-4">
                  {history.slice(-10).map((h) => (
                    <div key={h.j} className="flex-1 flex flex-col items-center justify-end gap-1 min-w-0 h-full">
                      <span className="font-mono text-[10px] text-white">{h.total}</span>
                      <div className="w-full rounded-t-md bg-gradient-to-t from-hack to-neon" style={{ height: `${Math.max(4, (h.total / maxH) * 70)}%` }} title={`J${h.j}: ${h.total} pts, ${h.rank}º`} />
                      <span className="font-mono text-[10px] text-slate-500">J{h.j}</span>
                      <span className="font-mono text-[9px] text-hack">{h.rank}º</span>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </div>
        </div>
      );
    }

    /* =====================================================
       TOASTS
    ===================================================== */
    function Toasts({ toasts }) {
      return (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 w-[calc(100%-32px)] max-w-sm pointer-events-none">
          {toasts.map((t) => (
            <div key={t.id} className={`fade-in rounded-xl px-4 py-3 text-sm font-semibold border backdrop-blur-md ${t.tone === 'error' ? 'bg-danger/15 border-danger/50 text-danger' : 'bg-black/85 border-neon/50 text-neon glow-green'}`}>{t.msg}</div>
          ))}
        </div>
      );
    }

    /* =====================================================
       APP
    ===================================================== */
    function App() {
      const saved = useMemo(loadState, []);
      const [squad, setSquad] = useState(saved?.squad || INITIAL_SQUAD);
      const [market, setMarket] = useState(saved?.market || INITIAL_MARKET);
      const [budget, setBudget] = useState(saved?.budget ?? INITIAL_BUDGET);
      const [rivals, setRivals] = useState(saved?.rivals || INITIAL_RIVALS);
      const [formation, setFormationState] = useState(saved?.formation || '4-3-3');
      const [captainId, setCaptainId] = useState(saved?.captainId !== undefined ? saved.captainId : 's6');
      const [jornada, setJornada] = useState(saved?.jornada || 11);
      const [myPoints, setMyPoints] = useState(saved?.myPoints ?? INITIAL_POINTS);
      const [myLast, setMyLast] = useState(saved?.myLast ?? 58);
      const [bids, setBids] = useState(saved?.bids || INITIAL_BIDS);
      const [history, setHistory] = useState(saved?.history || []);
      const [watch, setWatch] = useState(saved?.watch || ['m4', 'm8', 's11']);
      const [notifyOn, setNotifyOn] = useState(saved?.notifyOn || false);
      const [tab, setTab] = useState(() => { try { return localStorage.getItem('fh-tab') || 'hacker'; } catch (e) { return 'hacker'; } });
      const [live, setLive] = useState(false);
      const [sheet, setSheet] = useState(null);
      const [clausePlayerId, setClausePlayerId] = useState(null);
      const [result, setResult] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [flashes, setFlashes] = useState({});
      const [canInstall, setCanInstall] = useState(!!window.__fhInstall);

      ROUND.current = jornada;

      useEffect(() => {
        saveState({ squad, market, budget, rivals, formation, captainId, jornada, myPoints, myLast, bids, history, watch, notifyOn });
      }, [squad, market, budget, rivals, formation, captainId, jornada, myPoints, myLast, bids, history, watch, notifyOn]);
      useEffect(() => { try { localStorage.setItem('fh-tab', tab); } catch (e) { /* sin almacenamiento */ } }, [tab]);
      useEffect(() => {
        const h = () => setCanInstall(true);
        window.addEventListener('fh-install-ready', h);
        return () => window.removeEventListener('fh-install-ready', h);
      }, []);

      const toast = useCallback((msg, tone = 'ok') => {
        const id = uid('t');
        setToasts((t) => [...t.slice(-3), { id, msg, tone }]);
        setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
      }, []);
      const notify = useCallback((title, body) => {
        const sent = notifyOn && systemNotify(title, body);
        toast(sent ? `🔔 ${title}` : `🔔 ${title}: ${body}`);
      }, [notifyOn, toast]);

      // Refs para los intervalos
      const ref = useRef({});
      ref.current = { squad, market, watch, notify };

      const squadValue = useMemo(() => squad.reduce((s, p) => s + p.price, 0), [squad]);
      const projTotal = useMemo(() => {
        const st = squad.filter((p) => p.starter);
        const cap = st.find((p) => p.id === captainId);
        return st.reduce((s, p) => s + projection(p), 0) + (cap ? projection(cap) : 0);
      }, [squad, captainId, jornada]);
      const hacks = useMemo(() => generateHacks(squad, market, budget, formation, captainId), [squad, market, budget, formation, captainId, jornada]);
      const cards = useMemo(() => generateCards(squad, market), [squad, market, jornada]);
      const lookup = useMemo(() => Object.fromEntries([...market, ...squad].map((p) => [p.id, p])), [squad, market]);
      const holes = useMemo(() => holesOf(squad, formation), [squad, formation]);
      const standings = useMemo(() => [
        { id: 'me', name: 'Tú', points: myPoints, last: myLast, budget, value: squadValue },
        ...rivals.map((r) => ({ id: r.id, name: r.name, points: r.points, last: r.last, budget: r.budget, value: r.squadIds.reduce((s, id) => s + (DB[id]?.price || 0), 0) })),
      ].sort((a, b) => b.points - a.points), [rivals, myPoints, myLast, budget, squadValue]);

      /* ---------- Acciones ---------- */
      const recordBid = (type, player, amount) => setBids((b) => [{ id: uid('b'), j: jornada, who: 'Tú', type, player, amount }, ...b].slice(0, 60));

      const buyReplacement = (outId, inId) => {
        const out = squad.find((p) => p.id === outId);
        const inn = market.find((p) => p.id === inId);
        if (!out || !inn) return;
        if (inn.price > budget + out.price) { toast('Presupuesto insuficiente para este hack', 'error'); return; }
        const before = projection(out);
        setSquad((sq) => sq.map((p) => (p.id === outId ? { ...inn, starter: out.starter, isNew: false } : p)));
        setMarket((mk) => [...mk.filter((p) => p.id !== inId), { ...out, starter: false }]);
        setBudget((b) => r1(b + out.price - inn.price));
        if (captainId === outId) setCaptainId(inId);
        recordBid('venta', out.name, out.price); recordBid('compra', inn.name, inn.price);
        setSheet(null);
        const d = projection(inn) - before;
        toast(`⚡ ${inn.short} entra por ${out.short} · ${d >= 0 ? '+' : ''}${d.toFixed(1)} pts`);
      };
      const addPlayer = (inId, asStarter) => {
        const inn = market.find((p) => p.id === inId);
        if (!inn) return;
        if (inn.price > budget) { toast('No tienes caja suficiente', 'error'); return; }
        const starter = asStarter && holes[inn.pos] > 0;
        setSquad((sq) => [...sq, { ...inn, starter, isNew: false }]);
        setMarket((mk) => mk.filter((p) => p.id !== inId));
        setBudget((b) => r1(b - inn.price));
        recordBid('compra', inn.name, inn.price);
        setSheet(null);
        toast(`✔ ${inn.short} fichado ${starter ? 'y alineado' : 'al banquillo'} por ${fmtM(inn.price)}`);
      };
      const sellPlayer = (id) => {
        const p = squad.find((x) => x.id === id);
        if (!p) return;
        setSquad((sq) => sq.filter((x) => x.id !== id));
        setMarket((mk) => [{ ...p, starter: false }, ...mk]);
        setBudget((b) => r1(b + p.price));
        if (captainId === id) setCaptainId(null);
        recordBid('venta', p.name, p.price);
        setSheet(null);
        toast(`💰 ${p.short} vendido por ${fmtM(p.price)}`);
      };
      const benchSwap = (outId, inId) => {
        setSquad((sq) => sq.map((p) => (p.id === outId ? { ...p, starter: false } : p.id === inId ? { ...p, starter: true } : p)));
        if (captainId === outId) setCaptainId(inId);
        setSheet(null);
        const a = squad.find((p) => p.id === inId);
        toast(`🔁 ${a ? a.short : 'Suplente'} pasa al once titular`);
      };
      const setCaptain = (id) => {
        setCaptainId(id);
        setSheet(null);
        const p = squad.find((x) => x.id === id);
        toast(`© ${p ? p.short : 'Jugador'} es tu nuevo capitán (puntúa x2)`);
      };
      const setFormation = (f) => {
        setFormationState(f);
        const next = autoLineup(squad, f);
        setSquad(next);
        if (!next.find((p) => p.id === captainId && p.starter)) { const b = bestCaptain(next); setCaptainId(b ? b.id : null); }
        toast(`Formación ${f} aplicada`);
      };
      const autoAlign = () => {
        const next = autoLineup(squad, formation);
        setSquad(next);
        const b = bestCaptain(next);
        if (b) setCaptainId(b.id);
        toast('🤖 La IA ha alineado tu mejor once y elegido capitán');
      };
      const actions = { buyReplacement, addPlayer, sellPlayer, benchSwap, setCaptain };

      const executeHack = (h) => {
        if (h.type === 'swap') buyReplacement(h.outId, h.inId);
        else if (h.type === 'bench') benchSwap(h.outId, h.inId);
        else if (h.type === 'fill') addPlayer(h.inId, true);
        else if (h.type === 'captain') setCaptain(h.inId);
      };

      const onAnalyzed = (mode, payload) => {
        if (mode === 'team') {
          const players = (payload?.players || OCR_SQUAD).map((p) => ({ ...p, isNew: false }));
          const next = autoLineup(players, formation);
          setSquad(next);
          const taken = new Set(next.map((p) => p.id));
          setMarket((mk) => mk.filter((p) => !taken.has(p.id)));
          if (!payload) setBudget(OCR_BUDGET);
          else if (payload.budget > 0) setBudget(r1(payload.budget));
          const b = bestCaptain(next);
          setCaptainId(b ? b.id : null);
          toast(`✔ Equipo leído${payload ? ' con ' + payload.source : ''}: ${next.length} jugadores importados`);
        } else {
          const incoming = (payload?.players || OCR_MARKET).map((p) => ({ ...p, isNew: true, starter: false }));
          const squadIds = new Set(squad.map((p) => p.id));
          const fresh = incoming.filter((p) => !squadIds.has(p.id));
          setMarket((mk) => {
            const ids = new Set(fresh.map((p) => p.id));
            return [...fresh, ...mk.filter((p) => !ids.has(p.id))];
          });
          toast(`✔ Mercado leído: ${fresh.length} jugadores detectados`);
        }
      };

      const onImport = (data) => {
        const sq = Array.isArray(data.squad) ? data.squad.map(normalizePlayer) : null;
        const mk = Array.isArray(data.market) ? data.market.map(normalizePlayer) : null;
        if (!sq && !mk) { toast('El JSON debe tener "squad" y/o "market"', 'error'); return; }
        if (sq) {
          const next = sq.some((p) => p.starter) ? sq : autoLineup(sq, formation);
          setSquad(next);
          const b = bestCaptain(next); setCaptainId(b ? b.id : null);
        }
        if (mk) setMarket(mk);
        if (typeof data.budget === 'number') setBudget(r1(data.budget));
        toast(`✔ Datos importados${sq ? ` · ${sq.length} en plantilla` : ''}${mk ? ` · ${mk.length} en mercado` : ''}`);
      };

      const toggleWatch = (id) => setWatch((w) => (w.includes(id) ? w.filter((x) => x !== id) : [...w, id]));
      const openPlayer = (id) => setSheet({ mode: 'player', id });
      const protect = (id) => {
        setClausePlayerId(id);
        setTab('hacker');
        setTimeout(() => document.getElementById('clausulas')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
      };

      /* ---------- Mercado en directo (simulado) ---------- */
      useEffect(() => {
        if (!live) return;
        const t = setInterval(() => {
          const { squad: sq, market: mk, watch: w, notify: nt } = ref.current;
          const pool = [...sq, ...mk];
          const chosen = new Set();
          for (let i = 0; i < 3 && pool.length; i++) chosen.add(pool[Math.floor(Math.random() * pool.length)].id);
          const changes = {};
          const move = (p) => {
            if (!chosen.has(p.id)) return p;
            const pct = p.trend / 100 / 4 + (Math.random() - 0.45) * 0.03;
            const price = r2(Math.max(0.3, p.price * (1 + pct)));
            const trend = clamp(Math.round(p.trend + (pct > 0 ? 1 : -1) * Math.random() * 2), -15, 18);
            changes[p.id] = { p, pct, price };
            return { ...p, price, trend, hist: [...histOf(p).slice(1), price] };
          };
          setSquad(sq.map(move));
          setMarket(mk.map(move));
          const fl = {};
          Object.entries(changes).forEach(([id, { p, pct, price }]) => {
            fl[id] = { up: pct >= 0, t: Date.now() };
            if (w.includes(id) && pct >= 0.015) nt(`${p.short} sube ${(pct * 100).toFixed(1)}%`, `Ahora vale ${fmtM(price)}. ¡Ficha o blinda antes del cierre!`);
            if (w.includes(id) && pct <= -0.02) nt(`${p.short} cae ${(Math.abs(pct) * 100).toFixed(1)}%`, `Ahora vale ${fmtM(price)}.`);
          });
          setFlashes((f) => ({ ...f, ...fl }));
        }, 5000);
        return () => clearInterval(t);
      }, [live]);

      /* ---------- Avisos de cierre de mercado ---------- */
      const notified = useRef({});
      const hackCount = hacks.length;
      useEffect(() => {
        if (!notifyOn) return;
        const check = () => {
          const close = nextMarketClose();
          const left = close - Date.now();
          [[60, '1 hora'], [15, '15 minutos']].forEach(([mins, label]) => {
            const k = close.getTime() + '-' + mins;
            if (left <= mins * 60000 && !notified.current[k]) {
              notified.current[k] = true;
              ref.current.notify(`El mercado cierra en ${label}`, `Revisa tu once, el capitán y tus ${hackCount} hacks pendientes.`);
            }
          });
        };
        check();
        const t = setInterval(check, 30000);
        return () => clearInterval(t);
      }, [notifyOn, hackCount]);

      const toggleNotify = async () => {
        if (notifyOn) { setNotifyOn(false); toast('Avisos desactivados'); return; }
        if (!('Notification' in window)) { setNotifyOn(true); toast('Tu navegador no soporta notificaciones: te avisaré dentro de la app'); return; }
        try {
          const perm = await Notification.requestPermission();
          setNotifyOn(true);
          toast(perm === 'granted' ? '🔔 Avisos activados: cierre de mercado y precios vigilados' : 'Permiso denegado: te avisaré dentro de la app');
        } catch (e) { setNotifyOn(true); }
      };
      const install = async () => {
        const ev = window.__fhInstall;
        if (!ev) return;
        ev.prompt();
        const choice = await ev.userChoice.catch(() => null);
        window.__fhInstall = null; setCanInstall(false);
        if (choice && choice.outcome === 'accepted') toast('📲 Fantasy Hacker instalada');
      };

      /* ---------- Jornada ---------- */
      const simulate = () => setResult(simulateMatchday(squad, captainId, rivals));
      const applyMatchday = () => {
        if (!result) return;
        const myPts = Object.fromEntries(result.rows.map((r) => [r.p.id, r.pts]));
        const rank = [{ id: 'me', pts: result.mine }, ...result.rivalRows].sort((a, b) => b.pts - a.pts).findIndex((x) => x.id === 'me') + 1;
        setMyPoints((p) => p + result.mine);
        setMyLast(result.mine);
        setRivals((rs) => rs.map((r) => {
          const rr = result.rivalRows.find((x) => x.id === r.id);
          return rr ? { ...r, points: r.points + rr.pts, last: rr.pts, budget: r1(r.budget + 1 + Math.random() * 3) } : r;
        }));
        setSquad((sq) => sq.map((p) => evolvePlayer(p, myPts[p.id] ?? simPoints(p).pts)));
        setMarket((mk) => mk.map((p) => evolvePlayer(p, simPoints(p).pts)));
        setHistory((h) => [...h, { j: jornada, total: result.mine, rank }]);
        // Los rivales mueven ficha en el mercado
        const r = rivals[Math.floor(Math.random() * rivals.length)];
        const target = market[Math.floor(Math.random() * market.length)];
        if (r && target) setBids((b) => [{ id: uid('b'), j: jornada, who: r.name, type: 'puja', player: target.name, amount: r1(target.price * 1.1) }, ...b].slice(0, 60));
        setBudget((b) => r1(b + 2));
        setJornada((j) => j + 1);
        setResult(null);
        toast(`🏁 Jornada ${jornada} cerrada: ${result.mine} pts · ${rank}º de la jornada · +2.0M€ de premio`);
      };

      const reset = () => {
        if (!confirm('¿Reiniciar todos los datos de prueba?')) return;
        setSquad(INITIAL_SQUAD); setMarket(INITIAL_MARKET); setBudget(INITIAL_BUDGET); setRivals(INITIAL_RIVALS);
        setFormationState('4-3-3'); setCaptainId('s6'); setJornada(11); setMyPoints(INITIAL_POINTS); setMyLast(58);
        setBids(INITIAL_BIDS); setHistory([]); setResult(null); setSheet(null); setLive(false);
        toast('Datos de prueba restaurados');
      };

      const tabAlerts = { hacker: hacks.filter((h) => h.severity === 'critical').length, mercado: 0, liga: 0, jornada: result ? 1 : 0 };

      return (
        <>
          <Navbar squadValue={squadValue} budget={budget} projTotal={projTotal} jornada={jornada} onReset={reset} canInstall={canInstall} onInstall={install} live={live} />
          <MarketCloseBanner jornada={jornada} notifyOn={notifyOn} onToggleNotify={toggleNotify} onTest={() => notify('Prueba de aviso', 'Así te avisaré antes del cierre de mercado.')} />
          <TabBar tab={tab} setTab={setTab} alerts={tabAlerts} />

          <main className="max-w-7xl mx-auto px-4 py-5 space-y-5">
            {tab === 'hacker' && (
              <>
                <UploadZone onAnalyzed={onAnalyzed} toast={toast} />
                <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)] gap-5 items-start">
                  <div className="space-y-5 order-2 lg:order-1 min-w-0">
                    <Pitch squad={squad} formation={formation} setFormation={setFormation} captainId={captainId}
                      onSelect={openPlayer} onEmpty={(pos) => setSheet({ mode: 'add', pos })} projTotal={projTotal} onAuto={autoAlign} />
                    <ClauseCalculator squad={squad} rivals={rivals} setRivals={setRivals} playerId={clausePlayerId || squad[0]?.id} setPlayerId={setClausePlayerId} />
                  </div>
                  <div className="space-y-5 order-1 lg:order-2 min-w-0">
                    <HackerFeed hacks={hacks} onExecute={executeHack} lookup={lookup} />
                  </div>
                </div>
                <RecommendationCards cards={cards} />
              </>
            )}
            {tab === 'mercado' && (
              <MarketTab squad={squad} market={market} budget={budget} holes={holes} watch={watch} toggleWatch={toggleWatch}
                live={live} setLive={setLive} actions={actions} onImport={onImport} flashes={flashes} openPlayer={openPlayer} toast={toast} />
            )}
            {tab === 'liga' && <LeagueTab standings={standings} rivals={rivals} squad={squad} bids={bids} onProtect={protect} />}
            {tab === 'jornada' && <MatchdayTab jornada={jornada} projTotal={projTotal} result={result} onSimulate={simulate} onApply={applyMatchday} history={history} />}

            <footer className="text-center text-[11px] text-slate-600 font-mono py-6 leading-relaxed">
              FANTASY HACKER · Datos de prueba con fines de demostración · Proyecciones del motor local de IA<br />
              Instálala en el móvil desde el menú del navegador → «Añadir a pantalla de inicio»
            </footer>
          </main>

          <PlayerSheet sheet={sheet} squad={squad} market={market} budget={budget} captainId={captainId} onClose={() => setSheet(null)} actions={actions} />
          <Toasts toasts={toasts} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
